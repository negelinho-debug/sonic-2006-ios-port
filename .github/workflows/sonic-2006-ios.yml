name: Sonic 2006 - FETCH latest v16 FULL LOG

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fetch_latest_v16_unity_log:
    name: Fetch latest v16 Unity crash log
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Find latest v16 run and Unity job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p full-unity-log

          RUN_ID=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50"               --jq '.workflow_runs[] | select(.name == "Sonic 2006 iOS - NO PC v16") | .id'               | head -1
          )

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: latest v16 run not found"
            exit 1
          fi

          echo "V16_RUN_ID=$RUN_ID" | tee full-unity-log/run-id.txt

          JOB_ID=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100"               --jq '.jobs[] | select(.name == "Setup + Activate + Build Unity iOS") | .id'               | head -1
          )

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: Unity build job not found in v16 run"
            exit 1
          fi

          echo "UNITY_JOB_ID=$JOB_ID" | tee full-unity-log/job-id.txt

          HTTP_CODE=$(
            curl               --location               --silent               --show-error               --fail-with-body               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -o full-unity-log/Unity-build-job.log               -w "%{http_code}"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs"
          )

          echo "HTTP_CODE=$HTTP_CODE" | tee full-unity-log/http.txt
          test -s full-unity-log/Unity-build-job.log

          grep -a -niE             'error CS[0-9]+|Compilation failed|SIGABRT|Caught fatal signal|Assertion failed|Fatal error|Build failed|exit code 134|did the Editor crash|Crash|abort|FMOD|AudioManager|stack trace|memory map|executeMethod class|exception'             full-unity-log/Unity-build-job.log             | tail -1200             > full-unity-log/important-errors.txt             || true

          tail -1500 full-unity-log/Unity-build-job.log             > full-unity-log/tail-1500.txt             || true

          echo "===== LOG SIZE ====="
          wc -c full-unity-log/Unity-build-job.log
          wc -l full-unity-log/Unity-build-job.log || true

      - name: Upload latest v16 full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-RECOVERED-FULL-Unity-Log-v16
          path: full-unity-log
          if-no-files-found: warn
          compression-level: 0
