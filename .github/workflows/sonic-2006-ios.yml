name: Sonic P-06 iOS - v11 FAST (scene path fix)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build_sonic_ios:
    name: 1. Build Sonic iOS Xcode
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}

    outputs:
      xcode_ready: ${{ steps.detect_xcode.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          set -e

          # GitHub's ubuntu runner already ships with the tools we need.
          # Do NOT run apt-get update unless something is actually missing:
          # a broken third-party apt index was killing the job before APK download.
          rm -rf work tools recovered output release-files
          mkdir -p work tools recovered output release-files

          missing_pkgs=""

          command -v unzip >/dev/null 2>&1 || missing_pkgs="$missing_pkgs unzip"
          command -v curl  >/dev/null 2>&1 || missing_pkgs="$missing_pkgs curl"
          command -v jq    >/dev/null 2>&1 || missing_pkgs="$missing_pkgs jq"
          command -v xz    >/dev/null 2>&1 || missing_pkgs="$missing_pkgs xz-utils"
          command -v strings >/dev/null 2>&1 || missing_pkgs="$missing_pkgs binutils"

          if [ -n "$missing_pkgs" ]; then
            echo "Missing packages:$missing_pkgs"
            echo "Trying apt only because something is actually missing..."

            # Retry transient mirrors. A failed update alone is not fatal;
            # package installation can still use the runner's existing indexes.
            sudo apt-get update               -o Acquire::Retries=4               -o Acquire::http::Timeout=30               -o Acquire::https::Timeout=30               || echo "WARNING: apt-get update failed; trying cached indexes."

            sudo apt-get install -y --no-install-recommends $missing_pkgs
          fi

          echo "===== TOOL CHECK ====="
          for c in unzip curl jq xz strings gh git python3; do
            printf "%-10s " "$c"
            command -v "$c" || {
              echo "ERROR: required tool missing: $c"
              exit 1
            }
          done

      - name: Download newest Sonic Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "===== NEWEST GITHUB RELEASE ====="
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: no GitHub Release found."
            exit 1
          fi

          echo "TAG=$TAG"
          gh release view "$TAG"

          rm -rf release-files
          mkdir -p release-files

          gh release download "$TAG" \
            --dir release-files \
            --pattern "*.apk"

          echo "===== APK ASSETS ====="
          find release-files -type f -iname "*.apk" -printf '%p  %s bytes\n' | sort

          APK=$(find release-files -type f -iname "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: newest Release has no .apk asset."
            exit 1
          fi

          # If there are multiple APKs, use the largest one: the full Sonic Release
          # should be much larger than an old demo.
          APK=$(
            find release-files -type f -iname "*.apk" -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )

          echo "SELECTED_APK=$APK"
          echo "APK=$APK" | tee output/apk-path.txt

          cp "$APK" work/SonicP06Release.apk
          ls -lh work/SonicP06Release.apk

      - name: Extract and inspect new Sonic Release
        id: inspect
        continue-on-error: true
        run: |
          set +e

          rm -rf work/android
          mkdir -p work/android output

          echo "===== APK SIZE ====="
          ls -lh work/SonicP06Release.apk | tee output/apk-size.txt

          echo "===== EXTRACT APK ====="
          unzip -q work/SonicP06Release.apk -d work/android
          UNZIP_CODE=$?
          echo "UNZIP_CODE=$UNZIP_CODE" | tee output/unzip-status.txt

          echo "===== TOP APK TREE ====="
          find work/android -maxdepth 4 -type f \
            -printf '%p  %s bytes\n' \
            | sort \
            | head -1200 \
            | tee output/apk-tree.txt || true

          echo "===== LOCATE UNITY DATA ====="

          GGM=$(
            find work/android -type f -name globalgamemanagers -print \
              | head -1
          )

          if [ -n "$GGM" ]; then
            DATA_DIR="$(dirname "$GGM")"
          else
            DATA_DIR=""
          fi

          echo "GLOBALGAMEMANAGERS=$GGM" | tee output/unity-data-path.txt
          echo "DATA_DIR=$DATA_DIR" | tee -a output/unity-data-path.txt

          if [ -z "$DATA_DIR" ] || [ ! -d "$DATA_DIR" ]; then
            echo "UNITY_VERSION=UNKNOWN" | tee output/unity-version.txt
            echo "SCRIPT_BACKEND=UNKNOWN" | tee output/script-backend.txt
            echo "COMPATIBLE=false" | tee output/compatibility.txt

            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "unity_version=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "script_backend=UNKNOWN" >> "$GITHUB_OUTPUT"

            echo
            echo "ERROR: Unity Data/globalgamemanagers was not found."
            echo "The APK layout is different from the old demo."
            exit 1
          fi

          echo "===== UNITY DATA FILES ====="
          find "$DATA_DIR" -maxdepth 2 -type f \
            -printf '%p  %s bytes\n' \
            | sort \
            | head -1600 \
            | tee output/unity-data-files.txt || true

          VERSION=$(
            strings "$GGM" 2>/dev/null \
              | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
              | head -1
          )

          if [ -z "$VERSION" ]; then
            # Fallback: search small Unity metadata files, not the huge texture blobs.
            VERSION=$(
              find "$DATA_DIR" -maxdepth 1 -type f -size -20M -print0 \
                | xargs -0 strings 2>/dev/null \
                | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
                | head -1
            )
          fi

          [ -n "$VERSION" ] || VERSION="UNKNOWN"

          echo "UNITY_VERSION=$VERSION" | tee output/unity-version.txt

          MANAGED_DLL=$(
            find "$DATA_DIR" -type f -path "*/Managed/Assembly-CSharp.dll" -print \
              | head -1
          )

          METADATA=$(
            find work/android -type f -name global-metadata.dat -print \
              | head -1
          )

          if [ -n "$MANAGED_DLL" ]; then
            BACKEND="MONO"
            echo "SCRIPT_BACKEND=$BACKEND" | tee output/script-backend.txt
            echo "ASSEMBLY_CSHARP=$MANAGED_DLL" | tee output/managed-path.txt

            echo "===== MANAGED CODE ====="
            ls -lh "$MANAGED_DLL"

            strings "$MANAGED_DLL" \
              | grep -E 'VirtualJoystick|AButton|BButton|XButton|YButton|StartButton|BackButton|GameInput|XInput|GamePad|Touch|Joystick' \
              | sort -u \
              | head -500 \
              | tee output/mobile-input-markers.txt || true

          elif [ -n "$METADATA" ]; then
            BACKEND="IL2CPP"
            echo "SCRIPT_BACKEND=$BACKEND" | tee output/script-backend.txt
            echo "GLOBAL_METADATA=$METADATA" | tee output/il2cpp-files.txt

            find work/android -type f \
              \( -name "global-metadata.dat" -o -name "libil2cpp.so" \) \
              -print \
              | tee -a output/il2cpp-files.txt || true
          else
            BACKEND="UNKNOWN"
            echo "SCRIPT_BACKEND=$BACKEND" | tee output/script-backend.txt
          fi

          echo "===== SCENE FILES ====="
          find "$DATA_DIR" -maxdepth 1 -type f \
            \( -name 'level*' -o -name '*.sharedAssets' \) \
            -printf '%f  %s bytes\n' \
            | sort -V \
            | tee output/apk-scenes.txt || true

          echo "===== ANDROID NATIVE LIBS ====="
          find work/android/lib -maxdepth 3 -type f \
            -printf '%p  %s bytes\n' \
            | sort \
            | tee output/android-native-libs.txt || true

          COMPATIBLE=true

          if [ "$VERSION" != "2018.2.0f2" ]; then
            COMPATIBLE=false
          fi

          if [ "$BACKEND" != "MONO" ]; then
            COMPATIBLE=false
          fi

          echo "COMPATIBLE=$COMPATIBLE" | tee output/compatibility.txt

          echo "compatible=$COMPATIBLE" >> "$GITHUB_OUTPUT"
          echo "unity_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "script_backend=$BACKEND" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "UNITY_VERSION=$VERSION"
          echo "SCRIPT_BACKEND=$BACKEND"
          echo "COMPATIBLE=$COMPATIBLE"
          echo "DATA_DIR=$DATA_DIR"
          echo "=========================================="

          if [ "$COMPATIBLE" != "true" ]; then
            echo
            echo "This APK is a different Unity build than the old demo."
            echo "Diagnostics were captured. Do not start the old 2018.2 build yet."
            exit 1
          fi

          exit 0

      - name: Upload APK inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-APK-Inspection-v10
          path: |
            output/apk-size.txt
            output/unzip-status.txt
            output/apk-tree.txt
            output/unity-data-path.txt
            output/unity-data-files.txt
            output/unity-version.txt
            output/script-backend.txt
            output/compatibility.txt
            output/managed-path.txt
            output/il2cpp-files.txt
            output/mobile-input-markers.txt
            output/apk-scenes.txt
            output/android-native-libs.txt
          if-no-files-found: ignore
          compression-level: 0

      - name: Continue with deep Unity probe
        if: steps.inspect.outcome != 'success'
        run: |
          echo "===== STANDARD UNITY LAYOUT NOT FOUND ====="
          cat output/unity-version.txt 2>/dev/null || true
          cat output/script-backend.txt 2>/dev/null || true
          echo
          echo "v4 will NOT stop here."
          echo "AssetRipper will scan the whole extracted APK next."
          echo "We will also scan for UnityFS bundles, libunity.so and nested OBB/ZIP data."

      - name: Deep scan APK for Unity data
        run: |
          set +e
          mkdir -p output work/nested

          echo "===== UNITY-NAMED FILES ====="
          find work/android -type f \
            \( -iname "globalgamemanagers" \
               -o -iname "resources.assets" \
               -o -iname "sharedassets*.assets" \
               -o -iname "global-metadata.dat" \
               -o -iname "Assembly-CSharp.dll" \
               -o -iname "libunity.so" \
               -o -iname "libil2cpp.so" \
               -o -iname "*.unity3d" \
               -o -iname "*.bundle" \) \
            -printf '%p  %s bytes\n' \
            | sort \
            | tee output/deep-unity-files.txt

          echo "===== UNITYFS MAGIC ====="
          find work/android -type f -size +32k -size -600M -print0 \
            | while IFS= read -r -d '' f; do
                if head -c 64 "$f" 2>/dev/null | grep -aq "UnityFS"; then
                  echo "$f"
                fi
              done \
            | tee output/unityfs-files.txt

          echo "===== UNITY HINTS ====="
          {
            find work/android -type f -iname "libunity.so" -print
            find work/android -type f -iname "libil2cpp.so" -print
            strings work/android/AndroidManifest.xml 2>/dev/null \
              | grep -Ei "unity|player|il2cpp" \
              | head -200
          } | tee output/unity-hints.txt

          echo "===== NESTED OBB/ZIP ====="
          find work/android -type f \
            \( -iname "*.obb" -o -iname "*.zip" \) \
            -printf '%p  %s bytes\n' \
            | sort \
            | tee output/nested-archives.txt

          n=0
          while IFS= read -r archive; do
            [ -f "$archive" ] || continue
            if unzip -tqq "$archive" >/dev/null 2>&1; then
              n=$((n+1))
              mkdir -p "work/nested/$n"
              unzip -q "$archive" -d "work/nested/$n" || true
            fi
          done < <(
            find work/android -type f \( -iname "*.obb" -o -iname "*.zip" \) -print
          )

          echo "===== UNITY FILES IN NESTED DATA ====="
          find work/nested -type f \
            \( -iname "globalgamemanagers" \
               -o -iname "resources.assets" \
               -o -iname "sharedassets*.assets" \
               -o -iname "global-metadata.dat" \
               -o -iname "Assembly-CSharp.dll" \
               -o -iname "libunity.so" \
               -o -iname "libil2cpp.so" \
               -o -iname "*.unity3d" \
               -o -iname "*.bundle" \) \
            -printf '%p  %s bytes\n' \
            | sort \
            | tee output/nested-unity-files.txt

          GGM=$(find work/android work/nested -type f -name globalgamemanagers -print | head -1)
          RES=$(find work/android work/nested -type f -name resources.assets -print | head -1)
          UNITYFS=$(cat output/unityfs-files.txt 2>/dev/null | head -1)

          if [ -n "$GGM" ]; then
            TARGET="$(dirname "$GGM")"
          elif [ -n "$RES" ]; then
            TARGET="$(dirname "$RES")"
          elif [ -n "$UNITYFS" ]; then
            TARGET="$(dirname "$UNITYFS")"
          else
            TARGET="$PWD/work/android"
          fi

          TARGET="$(cd "$TARGET" 2>/dev/null && pwd || echo "$PWD/work/android")"
          echo "$TARGET" | tee output/assetripper-load-target.txt
          echo "ASSETRIPPER_LOAD_TARGET=$TARGET"

      - name: Download AssetRipper 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "===== ASSETRIPPER 2.0.0 RELEASE ASSETS ====="

          gh api \
            repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' \
            | tee output/assetripper-assets.txt

          ASSET=$(
            grep -Ei \
              '^AssetRipper_linux_(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
              output/assetripper-assets.txt \
              | head -1
          )

          if [ -z "$ASSET" ]; then
            ASSET=$(
              grep -Ei \
                'linux.*(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
                output/assetripper-assets.txt \
                | head -1
            )
          fi

          if [ -z "$ASSET" ]; then
            echo "ERROR: no Linux x64 AssetRipper archive found in release 2.0.0"
            cat output/assetripper-assets.txt
            exit 1
          fi

          echo "SELECTED_ASSET=$ASSET"

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p "$ASSET" \
            -D tools

          ARCHIVE="tools/$ASSET"
          test -s "$ARCHIVE"

          mkdir -p tools/assetripper

          case "$ARCHIVE" in
            *.tar.xz)
              tar -xJf "$ARCHIVE" -C tools/assetripper
              ;;
            *.zip)
              unzip -q "$ARCHIVE" -d tools/assetripper
              ;;
            *)
              echo "ERROR: unsupported AssetRipper archive: $ARCHIVE"
              exit 1
              ;;
          esac

          echo "===== ASSETRIPPER FILES ====="
          find tools/assetripper -maxdepth 4 -type f -print | head -200

          RIPPER=$(
            find tools/assetripper \
              -type f \
              \( -name "AssetRipper.GUI.Free" \
                 -o -name "AssetRipper.GUI.Free.exe" \
                 -o -name "AssetRipper.GUI" \
                 -o -name "AssetRipper" \) \
              | head -1
          )

          if [ -z "$RIPPER" ]; then
            echo "ERROR: AssetRipper executable not found after extraction"
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "$RIPPER" > output/assetripper-path.txt

          echo "ASSETRIPPER=$RIPPER"
          "$RIPPER" --help | head -120 || true

      - name: Recover Unity project with AssetRipper
        run: |
          set -e

          RIPPER=$(cat output/assetripper-path.txt)
          PORT=3333

          "$RIPPER" \
            --headless \
            --port "$PORT" \
            > output/assetripper.log 2>&1 &

          RIPPER_PID=$!
          echo "$RIPPER_PID" > output/assetripper.pid

          READY=0

          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: AssetRipper web service did not start."
            tail -200 output/assetripper.log || true
            exit 1
          fi

          DATA_DIR=$(cat output/assetripper-load-target.txt 2>/dev/null || true)
          if [ -z "$DATA_DIR" ] || [ ! -d "$DATA_DIR" ]; then
            DATA_DIR="$PWD/work/android"
          fi
          EXPORT_DIR="$PWD/recovered/SonicP06Release"

          echo "ASSETRIPPER LOAD TARGET: $DATA_DIR"

          mkdir -p "$EXPORT_DIR"

          echo "===== FIX405 ACTIVE ====="
          echo "===== LOAD UNITY DATA ====="

          LOAD_CODE=$(
            curl -sS \
              -o output/loadfolder-response.txt \
              -w "%{http_code}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "Path=$DATA_DIR" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )

          echo "LOADFOLDER_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "302" ] && [ "$LOAD_CODE" != "200" ]; then
            echo "ERROR: AssetRipper /LoadFolder returned HTTP $LOAD_CODE"
            echo "===== RESPONSE ====="
            cat output/loadfolder-response.txt || true
            echo "===== ASSETRIPPER LOG ====="
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "===== EXPORT UNITY PROJECT ====="

          EXPORT_CODE=$(
            curl -sS \
              -o output/export-response.txt \
              -w "%{http_code}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "Path=$EXPORT_DIR" \
              --data-urlencode "CreateSubfolder=false" \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )

          echo "EXPORT_HTTP=$EXPORT_CODE"

          if [ "$EXPORT_CODE" != "302" ] && [ "$EXPORT_CODE" != "200" ]; then
            echo "ERROR: AssetRipper /Export/UnityProject returned HTTP $EXPORT_CODE"
            echo "===== RESPONSE ====="
            cat output/export-response.txt || true
            echo "===== ASSETRIPPER LOG ====="
            tail -250 output/assetripper.log || true
            exit 1
          fi

          kill "$RIPPER_PID" 2>/dev/null || true
          wait "$RIPPER_PID" 2>/dev/null || true

          echo "===== RECOVERED ROOT ====="
          find "$EXPORT_DIR" -maxdepth 3 -type d | head -180

          PROJECT=""

          if [ -d "$EXPORT_DIR/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT_DIR/ExportedProject"
          elif [ -d "$EXPORT_DIR/Assets" ]; then
            PROJECT="$EXPORT_DIR"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: AssetRipper did not export a Unity Assets/ directory"
            tail -250 output/assetripper.log || true
            exit 1
          fi

          if [ ! -d "$PROJECT/ProjectSettings" ]; then
            echo "ERROR: AssetRipper did not export ProjectSettings/"
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "$PROJECT" > output/recovered-project-path.txt
          echo "RECOVERED_PROJECT=$PROJECT"

      - name: Prepare recovered project for iOS
        id: prepare_ios
        run: |
          set -e

          PROJECT=$(cat output/recovered-project-path.txt)

          mkdir -p output/original-managed

          ORIGINAL_CSHARP=$(
            find work/android work/nested -type f               -path "*/Managed/Assembly-CSharp.dll" -print               | head -1
          )

          if [ -n "$ORIGINAL_CSHARP" ]; then
            cp "$ORIGINAL_CSHARP" output/original-managed/Assembly-CSharp.dll
            echo "Original managed DLL: $ORIGINAL_CSHARP"
          else
            echo "No original Assembly-CSharp.dll found; continuing with recovered project."
          fi

          # Android native binaries cannot run on iOS.
          # Keep a report, but remove Android-only plugins from the Unity project.
          find "$PROJECT/Assets" \
            -type f \
            \( -iname "*.so" -o -iname "*.aar" -o -iname "*.jar" \) \
            -print \
            | tee output/removed-android-plugins.txt || true

          find "$PROJECT/Assets" \
            -type f \
            \( -iname "*.so" -o -iname "*.aar" -o -iname "*.jar" \) \
            -delete || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true

          echo "===== V17 FIX: REMOVE DUPLICATE UNITY ENGINE MODULE ====="
          mkdir -p output

          # v16 full log proved that Unity 2018.2 already provides:
          # /opt/unity/Editor/Data/Managed/UnityEngine/UnityEngine.SpatialTrackingModule.dll
          # AssetRipper also exported a second copy into Assets/Plugins, which causes CS1704.
          find "$PROJECT/Assets/Plugins"             -type f             \( -name "UnityEngine.SpatialTrackingModule.dll"                -o -name "UnityEngine.SpatialTrackingModule.dll.meta"                -o -name "UnityEngine.SpatialTrackingModule.dll.mdb"                -o -name "UnityEngine.SpatialTrackingModule.pdb" \)             -print             | tee output/removed-duplicate-spatialtracking.txt             || true

          find "$PROJECT/Assets/Plugins"             -type f             \( -name "UnityEngine.SpatialTrackingModule.dll"                -o -name "UnityEngine.SpatialTrackingModule.dll.meta"                -o -name "UnityEngine.SpatialTrackingModule.dll.mdb"                -o -name "UnityEngine.SpatialTrackingModule.pdb" \)             -delete             || true

          if find "$PROJECT/Assets/Plugins" -type f                -name "UnityEngine.SpatialTrackingModule.dll"                -print -quit | grep -q .; then
            echo "ERROR: duplicate SpatialTrackingModule DLL still exists"
            exit 1
          fi

          echo "Duplicate SpatialTrackingModule removed."

          mkdir -p "$PROJECT/ProjectSettings"

          VERSION_FILE="$PROJECT/ProjectSettings/ProjectVersion.txt"

          echo "===== RECOVERED PROJECT VERSION ====="
          if [ -f "$VERSION_FILE" ]; then
            cat "$VERSION_FILE" | tee output/recovered-project-version-original.txt
          else
            echo "AssetRipper did not emit ProjectVersion.txt"               | tee output/recovered-project-version-original.txt
          fi

          EDITOR_VERSION=""
          CHANGESET=""

          if [ -f "$VERSION_FILE" ]; then
            EDITOR_VERSION=$(
              sed -n 's/^[[:space:]]*m_EditorVersion:[[:space:]]*//p' "$VERSION_FILE"                 | head -1                 | tr -d '\r'
            )

            CHANGESET=$(
              sed -n 's/.*m_EditorVersionWithRevision:.*(\([^)]*\)).*/\1/p' "$VERSION_FILE"                 | head -1                 | tr -d '\r'
            )
          fi

          # Only use the old-demo editor as a fallback when AssetRipper gives us
          # no usable version at all. The full Sonic Release may use another Unity.
          if [ -z "$EDITOR_VERSION" ] || [ "$EDITOR_VERSION" = "UNKNOWN" ]; then
            EDITOR_VERSION="2018.2.0f2"
            CHANGESET="787658998520"

            cat > "$VERSION_FILE" <<EOF
          m_EditorVersion: $EDITOR_VERSION
          m_EditorVersionWithRevision: $EDITOR_VERSION ($CHANGESET)
          EOF

            echo "WARNING: Unity version was missing; using old-demo fallback $EDITOR_VERSION."
          else
            echo "Keeping AssetRipper recovered editor: $EDITOR_VERSION"
          fi

          echo "BUILD_UNITY_VERSION=$EDITOR_VERSION" | tee output/build-unity-version.txt
          echo "BUILD_UNITY_CHANGESET=$CHANGESET" | tee -a output/build-unity-version.txt

          echo "unity_version=$EDITOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "unity_changeset=$CHANGESET" >> "$GITHUB_OUTPUT"
          echo "project_path=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "EXACT_PROJECT_PATH=$PROJECT"

          echo "===== FINAL PROJECT VERSION FILE ====="
          cat "$VERSION_FILE"

          echo "===== V10 CLEAN UNITY 2022 COMPILER SETTINGS ====="

          # Full Sonic Release is Unity 2022.3.x. Do not keep the old demo's
          # mcs/csc response-file hacks or force the old scripting runtime.
          rm -f "$PROJECT/Assets/mcs.rsp" "$PROJECT/Assets/csc.rsp" || true

          echo "Using Unity 2022 default Roslyn compiler settings."

          echo "===== C# FILES ====="
          find "$PROJECT/Assets" -type f -name "*.cs" | wc -l | tee output/csharp-count.txt

          echo "===== SCENES ====="
          find "$PROJECT/Assets" -type f -name "*.unity" \
            | sort \
            | tee output/scenes.txt

          echo "===== ANDROID-SPECIFIC C# REFERENCES ====="
          grep -RniE \
            'AndroidJava|RuntimePlatform\.Android|UNITY_ANDROID|GooglePlay|AdMob|BillingClient' \
            "$PROJECT/Assets" \
            --include="*.cs" \
            | head -200 \
            | tee output/android-csharp-references.txt || true

          echo "===== TOUCH / MOBILE REFERENCES ====="
          grep -RniE \
            'VirtualJoystick|Touch|AButton|BButton|XButton|YButton|StartButton|BackButton' \
            "$PROJECT/Assets" \
            --include="*.cs" \
            | head -250 \
            | tee output/touch-csharp-references.txt || true

          echo "===== V5 CLEAN SONIC RELEASE INPUT DISCOVERY ====="
          : > output/controller-backends-clean.txt

          grep -RniE \
            "XInputDotNetPure|GamePad\\.GetState|GamePadState|PlayerIndex|XInput|Rewired|InControl|ControllerInput|InputManager|Joystick|Gamepad|Touch|VirtualJoystick" \
            "$PROJECT/Assets" \
            --include="*.cs" \
            2>/dev/null \
            | head -800 \
            | tee output/controller-backends-clean.txt || true

          # IMPORTANT: this is a different, fuller Android release.
          # Do NOT inject the old demo's IOSInputBridge / XInput shim / Basic Controls
          # hider before we have one clean iOS compile.
          find "$PROJECT/Assets" -type f \
            \( -name "IOSInputBridge.cs" \
               -o -name "IOSXInputGamePad.cs" \
               -o -name "IOSNativeMobileUICleaner.cs" \) \
            -print -delete 2>/dev/null || true

          echo "V11 clean build: no old-demo touch/UI scripts injected."


          echo "===== V11 CREATE SCENE-SAFE IOS BUILD METHOD ====="
          mkdir -p "$PROJECT/Assets/Editor"

          cat > "$PROJECT/Assets/Editor/SonicIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class SonicIOSBuild
          {
              public static void PerformBuild()
              {
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s != null && s.enabled && !string.IsNullOrWhiteSpace(s.path))
                      .Select(s => s.path)
                      .Where(IsValidScene)
                      .Distinct()
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      scenes = AssetDatabase.FindAssets("t:Scene", new[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(IsValidScene)
                          .Distinct()
                          .OrderBy(p => p)
                          .ToArray();
                  }

                  if (scenes.Length == 0)
                      throw new Exception("V10: no valid Unity scenes were found.");

                  Debug.Log("V10 VALID SCENES (" + scenes.Length + "):");
                  foreach (string scene in scenes)
                      Debug.Log("  " + scene);

                  EditorBuildSettings.scenes = scenes
                      .Select(p => new EditorBuildSettingsScene(p, true))
                      .ToArray();

                  string output = Environment.GetEnvironmentVariable("SONIC_IOS_XCODE_PATH");
                  if (string.IsNullOrWhiteSpace(output))
                  {
                      output = Path.GetFullPath(
                          Path.Combine(Application.dataPath,
                                      "../../build/iOS/SonicP06-Release-iOS"));
                  }

                  Directory.CreateDirectory(output);
                  Debug.Log("V10 IOS XCODE OUTPUT: " + output);

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );
                  PlayerSettings.iOS.targetOSVersionString = "15.0";

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);

                  Debug.Log("V10 BUILD RESULT: " + report.summary.result);
                  Debug.Log("V10 BUILD ERRORS: " + report.summary.totalErrors);
                  Debug.Log("V10 BUILD WARNINGS: " + report.summary.totalWarnings);

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception(
                          "V10 iOS build failed: " + report.summary.result +
                          ", errors=" + report.summary.totalErrors
                      );
              }

              private static bool IsValidScene(string path)
              {
                  if (string.IsNullOrWhiteSpace(path))
                      return false;

                  string normalized = path.Replace('\\', '/');

                  if (!normalized.EndsWith(".unity", StringComparison.OrdinalIgnoreCase))
                      return false;

                  // Unity scene paths are project-relative (Assets/...).
                  // GameCI does not guarantee that the Editor process CWD is the
                  // recovered project root, so Path.GetFullPath(path) can point at
                  // /github/workspace/Assets/... and reject every real scene.
                  // Ask Unity's AssetDatabase first, then use Application.dataPath
                  // to build an absolute project-root path as a filesystem fallback.
                  SceneAsset sceneAsset = AssetDatabase.LoadAssetAtPath<SceneAsset>(normalized);
                  if (sceneAsset != null)
                      return true;

                  string projectRoot = Directory.GetParent(Application.dataPath).FullName;
                  string absolute = Path.Combine(projectRoot, normalized);
                  bool exists = File.Exists(absolute);

                  if (!exists)
                      Debug.LogWarning("V11 rejected scene path: " + normalized +
                                       " -> " + absolute);

                  return exists;
              }
          }
          CS

          echo "Created Assets/Editor/SonicIOSBuild.cs"


      - name: Create recovery report
        run: |
          set -e

          PROJECT=$(cat output/recovered-project-path.txt)

          {
            echo "SONIC P-06 SONIC RELEASE iOS - RECOVERY REPORT"
            echo "====================================="
            echo
            echo "Original APK: $(cat output/apk-path.txt | sed 's/^APK=//')"
            echo "Unity: $(cat output/unity-version.txt | sed 's/^UNITY_VERSION=//')"
            echo "Mono Assembly-CSharp.dll: YES"
            echo "Recovered Assets/: YES"
            echo "Recovered ProjectSettings/: YES"
            echo "Android native plugins removed from recovered project: YES"
            echo
            echo "Recovered C# files: $(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"
            echo "Recovered scenes: $(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
            echo
            echo "Recovered editor: $(cat output/build-unity-version.txt | head -1 | cut -d= -f2-)"
            echo "Target: Sonic P-06 Sonic Release -> iOS / arm64."
          } > output/RECOVERY-REPORT.txt

          cat output/RECOVERY-REPORT.txt

      - name: Check Unity login secrets
        run: |
          set -e

          if [ -z "$UNITY_USERNAME" ]; then
            echo "ERROR: UNITY_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$UNITY_PASSWORD" ]; then
            echo "ERROR: UNITY_PASSWORD secret is missing"
            exit 1
          fi

          echo "UNITY LOGIN SECRETS: OK"

      - name: Show exact recovered project layout
        run: |
          set -e
          echo "Path from AssetRipper:"
          cat output/recovered-project-path.txt
          echo
          echo "Recovered root:"
          find recovered/SonicP06Release -maxdepth 2 -type d | sort | head -100

      - name: Verify exact AssetRipper Unity project
        run: |
          set -e

          PROJECT="${{ steps.prepare_ios.outputs.project_path }}"
          VERSION_FILE="$PROJECT/ProjectSettings/ProjectVersion.txt"

          echo "===== V11 FAST: EXACT ASSETRIPPER PROJECT PATH ====="
          echo "PROJECT=$PROJECT"

          test -n "$PROJECT"
          test -d "$PROJECT"
          test -d "$PROJECT/Assets"
          test -f "$VERSION_FILE"

          echo "Recovered editor: ${{ steps.prepare_ios.outputs.unity_version }}"
          echo "Recovered changeset: ${{ steps.prepare_ios.outputs.unity_changeset }}"
          echo "ProjectVersion.txt:"
          cat "$VERSION_FILE"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Stabilize recovered Sonic Release project for Linux CI
        run: |
          set -e

          PROJECT="${{ steps.prepare_ios.outputs.project_path }}"
          echo "===== SONIC RELEASE v1 ====="

          # Start the first attempt from a clean import. The second attempt below
          # intentionally keeps the freshly generated Library cache, because v11
          # died late during import/shader work with exit 134.
          sudo rm -rf "$PROJECT/Library" "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" 2>/dev/null || true

          # Attempt 1 preserves the game assets/settings; attempt 2 only resets GraphicsSettings.
          # The original GraphicsSettings is backed up before the fallback retry.
          cat > "$PROJECT/SONIC-RELEASE-v5-CI-PATCH.txt" <<'EOF'
          Sonic P-06 Sonic Release iOS v11 FAST
          - clean build for the FULL Sonic Release, not the old demo
          - preserve AssetRipper's recovered Unity editor version
          - do not inject old-demo touch/XInput/UI hacks before the first clean compile
          - keep Android native-plugin cleanup
          - keep old Unity compiler compatibility only as a fallback
          - build iOS Xcode first; controls/graphics fixes come after a successful IPA
          EOF

      - name: Setup Node 22 for Unity CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity CLI + Unity Hub
        run: |
          set -e

          echo "===== V7 HUB SYMLINK FIX ACTIVE ====="

          npm install -g @rage-against-the-pixel/unity-cli

          echo "===== UNITY CLI ====="
          unity-cli --help >/dev/null
          echo "unity-cli: OK"

          echo "===== INSTALL UNITY HUB DIRECTLY ====="

          sudo apt-get update -o Acquire::Retries=4 || true
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            xvfb \
            libgbm1 \
            libgtk-3-0 \
            libnss3

          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor \
              -o /etc/apt/keyrings/unityhub.gpg

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/unityhub.list \
              >/dev/null

          sudo apt-get update -o Acquire::Retries=4 || true
          sudo apt-get install -y unityhub

          echo "===== HUB PACKAGE FILES ====="
          dpkg -L unityhub \
            | grep -E '/opt/unityhub|/usr/bin/unityhub' \
            | head -120 || true

          echo "===== DETECT INSTALLED HUB ====="

          HUB_CMD="$(command -v unityhub || true)"

          if [ -z "$HUB_CMD" ]; then
            echo "ERROR: unityhub command not found after apt install"
            dpkg -L unityhub || true
            exit 1
          fi

          echo "HUB_CMD=$HUB_CMD"
          ls -l "$HUB_CMD" || true
          file "$HUB_CMD" || true
          readlink -f "$HUB_CMD" || true

          echo "===== CREATE COMPATIBILITY HUB PATH ====="

          # Current Ubuntu Unity Hub package on this runner installs
          # /usr/bin/unityhub instead of /opt/unityhub/unityhub.
          # unity-cli still expects /opt/unityhub/unityhub on Linux.
          sudo mkdir -p /opt/unityhub

          sudo tee /opt/unityhub/unityhub >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$HUB_CMD" --no-sandbox --headless "\$@"
          EOF

          sudo chmod +x /opt/unityhub/unityhub

          test -x /opt/unityhub/unityhub
          test -e "$HUB_CMD"

          echo "UNITY_HUB_PATH=/opt/unityhub/unityhub" \
            >> "$GITHUB_ENV"

          echo "/opt/unityhub" >> "$GITHUB_PATH"

          echo "===== V8 HUB READY ====="
          ls -lh /opt/unityhub/unityhub "$HUB_CMD" || true

          echo "===== UNITY-CLI HUB CHECK ====="
          UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli hub-path || true

          UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli hub-version || true

      - name: Prepare real Unity Licensing Client
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -e

          echo "===== V11 LICENSING CLIENT FIX ACTIVE ====="

          find_client() {
            find \
              /usr \
              /opt \
              "$HOME" \
              -type f \
              -name "Unity.Licensing.Client" \
              2>/dev/null \
              | head -1
          }

          CLIENT="$(find_client || true)"

          if [ -z "$CLIENT" ]; then
            echo "Unity Licensing Client not found in Hub package."
            echo "Installing Unity 2018.2.0f2 so its Licensing Client is available."

            UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli setup-unity \
              --unity-project none \
              --unity-version 2018.2.0f2 \
              --changeset 787658998520 \
              --build-targets iOS \
              --modules ios \
              --json

            CLIENT="$(find_client || true)"
          fi

          if [ -z "$CLIENT" ]; then
            echo "ERROR: Unity.Licensing.Client still not found."
            echo "===== POSSIBLE UNITY FILES ====="
            find /usr /opt "$HOME" \
              -type f \
              \( -iname "*Licensing*Client*" -o -iname "Unity*" \) \
              2>/dev/null \
              | head -300 || true
            exit 1
          fi

          echo "FOUND_CLIENT=$CLIENT"

          CLIENT_DIR="$(dirname "$CLIENT")"

          sudo rm -rf /opt/unityhub/UnityLicensingClient
          sudo mkdir -p /opt/unityhub/UnityLicensingClient

          # Copy the whole client directory, not just the executable,
          # because the licensing binary can depend on sibling files.
          sudo cp -a "$CLIENT_DIR"/. /opt/unityhub/UnityLicensingClient/

          sudo chmod +x \
            /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client \
            || true

          test -f /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client

          echo "===== STAGED LICENSING CLIENT ====="
          find /opt/unityhub/UnityLicensingClient \
            -maxdepth 2 \
            -type f \
            -print \
            | head -120

          echo "The unity-cli glob /opt/unityhub/**/Unity.Licensing.Client can now resolve."

      - name: Activate Unity Personal - skip broken precheck
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -e

          echo "===== V11 PERSONAL ACTIVATION ====="
          echo "UNITY_HUB_PATH=$UNITY_HUB_PATH"

          test -x "$UNITY_HUB_PATH"
          test -e /usr/bin/unityhub

          GLOBAL_NODE_MODULES="$(npm root -g)"
          LICENSE_MODULE="$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli/dist/license-client.js"

          if [ ! -f "$LICENSE_MODULE" ]; then
            echo "ERROR: unity-cli licensing module not found:"
            echo "$LICENSE_MODULE"
            find "$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli" \
              -maxdepth 3 \
              -type f \
              -iname "*license-client*" \
              -print || true
            exit 1
          fi

          echo "LICENSE_MODULE=$LICENSE_MODULE"
          export LICENSE_MODULE

          # unity-cli normally checks active entitlements before activation.
          # On a fresh runner that precheck can fail before --activate-ulf runs.
          # The library API exposes skipEntitlementCheck as Activate(..., true).
          node <<'NODE'
          const {
            LicensingClient,
            LicenseType
          } = require(process.env.LICENSE_MODULE);

          async function main() {
            const client = new LicensingClient('6.x');

            await client.Activate(
              {
                licenseType: LicenseType.personal,
                username: process.env.UNITY_USERNAME,
                password: process.env.UNITY_PASSWORD
              },
              true
            );

            console.log("UNITY PERSONAL ACTIVATION: SUCCESS");
          }

          main().catch((error) => {
            console.error("UNITY PERSONAL ACTIVATION FAILED:");
            console.error(error && error.message ? error.message : error);
            process.exit(1);
          });
          NODE

          echo "===== LICENSE CONTEXT ====="
          unity-cli license-context || true

      - name: Collect Unity licensing diagnostics
        if: failure()
        run: |
          set +e

          mkdir -p licensing-diagnostics

          LOG_PATH="$(unity-cli licensing-client-logs 2>/dev/null | tail -1 || true)"
          AUDIT_PATH="$(unity-cli licensing-audit-logs 2>/dev/null | tail -1 || true)"

          echo "LOG_PATH=$LOG_PATH"
          echo "AUDIT_PATH=$AUDIT_PATH"

          if [ -n "$LOG_PATH" ] && [ -f "$LOG_PATH" ]; then
            cp "$LOG_PATH" licensing-diagnostics/Unity.Licensing.Client.log
            tail -160 "$LOG_PATH" || true
          fi

          if [ -n "$AUDIT_PATH" ] && [ -f "$AUDIT_PATH" ]; then
            cp "$AUDIT_PATH" licensing-diagnostics/Unity.Entitlements.Audit.log
            tail -160 "$AUDIT_PATH" || true
          fi

      - name: Upload Unity licensing diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-Unity-License-Diagnostics-v11
          path: licensing-diagnostics
          if-no-files-found: ignore
          compression-level: 0

      - name: Export activated Personal license for GameCI
        id: export_license
        run: |
          set -e

          echo "===== FIND ACTIVATED UNITY LICENSE ====="

          LICENSE_FILE=""

          for CANDIDATE in \
            "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf" \
            "$HOME/.config/unity3d/Unity/Unity_lic.ulf" \
            "/root/.local/share/unity3d/Unity/Unity_lic.ulf" \
            "/root/.config/unity3d/Unity/Unity_lic.ulf"
          do
            if [ -s "$CANDIDATE" ]; then
              LICENSE_FILE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$LICENSE_FILE" ]; then
            LICENSE_FILE=$(
              find \
                "$HOME" \
                /root \
                /usr/share/unity3d \
                /var/lib/unity3d \
                -type f \
                \( -name "Unity_lic.ulf" -o -name "*.ulf" \) \
                2>/dev/null \
                | head -1
            )
          fi

          if [ -z "$LICENSE_FILE" ] || [ ! -s "$LICENSE_FILE" ]; then
            echo "ERROR: Unity activation completed but no .ulf license file was found"
            echo "===== LICENSING DIRECTORIES ====="
            find "$HOME/.local/share" "$HOME/.config" \
              -maxdepth 5 \
              -type f \
              2>/dev/null \
              | grep -Ei 'unity|license|ulf' \
              | head -200 || true
            exit 1
          fi

          echo "LICENSE_FILE=$LICENSE_FILE"
          echo "LICENSE_SIZE=$(wc -c < "$LICENSE_FILE" | tr -d ' ') bytes"

          {
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF"
            cat "$LICENSE_FILE"
            echo
            echo "UNITY_LICENSE_EOF"
          } >> "$GITHUB_ENV"

          echo "Unity Personal license exported for the next build step."

      - name: Unity iOS build attempt 1
        id: unity_build_1
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          SONIC_IOS_XCODE_PATH: ${{ github.workspace }}/build/iOS/SonicP06-Release-iOS
        with:
          projectPath: ${{ steps.prepare_ios.outputs.project_path }}
          targetPlatform: iOS
          unityVersion: ${{ steps.prepare_ios.outputs.unity_version }}
          buildsPath: build
          buildName: SonicP06-Release-iOS
          allowDirtyBuild: true
          versioning: None
          buildMethod: SonicIOSBuild.PerformBuild
          customParameters: -accept-apiupdate -logFile /github/workspace/unity-attempt1.log

      - name: Inspect attempt 1
        id: detect_xcode_1
        if: always()
        run: |
          set +e

          echo "ATTEMPT1_OUTCOME=${{ steps.unity_build_1.outcome }}"
          echo "ATTEMPT1_ENGINE_EXIT=${{ steps.unity_build_1.outputs.engineExitCode }}"

          PROJECT="${{ steps.prepare_ios.outputs.project_path }}"
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" build 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" build 2>/dev/null || true

          PROJ=$(find build -type d -name "*.xcodeproj" -print 2>/dev/null | head -1)
          if [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 already generated Xcode: $PROJ"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 did not generate Xcode."
          fi

      - name: Prepare graphics-safe retry after Unity abort
        if: steps.detect_xcode_1.outputs.ready != 'true'
        run: |
          set +e

          PROJECT="${{ steps.prepare_ios.outputs.project_path }}"
          echo "===== V11 FAST WARM RETRY ====="
          echo "Attempt 1 used the V11 scene-safe iOS builder."
          echo "For attempt 2 we keep the scene-safe builder and regenerate GraphicsSettings.asset."

          mkdir -p v17-backup

          if [ -f "$PROJECT/ProjectSettings/GraphicsSettings.asset" ]; then
            cp "$PROJECT/ProjectSettings/GraphicsSettings.asset"               v17-backup/GraphicsSettings.asset.original
            rm -f "$PROJECT/ProjectSettings/GraphicsSettings.asset"
            echo "Original GraphicsSettings.asset backed up."
          else
            echo "GraphicsSettings.asset was already absent."
          fi

          # Temp/obj can contain stale locks after SIGABRT. Keep Library warm.
          sudo rm -rf "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" 2>/dev/null || true

          echo "Library size before retry:"
          du -sh "$PROJECT/Library" 2>/dev/null || true
          sleep 5

      - name: Unity iOS build attempt 2 - warm Library
        id: unity_build_2
        if: steps.detect_xcode_1.outputs.ready != 'true'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          SONIC_IOS_XCODE_PATH: ${{ github.workspace }}/build/iOS/SonicP06-Release-iOS
        with:
          projectPath: ${{ steps.prepare_ios.outputs.project_path }}
          targetPlatform: iOS
          unityVersion: ${{ steps.prepare_ios.outputs.unity_version }}
          buildsPath: build
          buildName: SonicP06-Release-iOS
          allowDirtyBuild: true
          versioning: None
          buildMethod: SonicIOSBuild.PerformBuild
          customParameters: -accept-apiupdate -logFile /github/workspace/unity-attempt2.log

      - name: Detect generated iOS Xcode project
        id: detect_xcode
        if: always()
        run: |
          set +e

          echo "===== V11 FAST FINAL XCODE DETECTION ====="
          echo "ATTEMPT1=${{ steps.unity_build_1.outcome }} / engine=${{ steps.unity_build_1.outputs.engineExitCode }}"
          echo "ATTEMPT2=${{ steps.unity_build_2.outcome }} / engine=${{ steps.unity_build_2.outputs.engineExitCode }}"

          sudo chown -R "$(id -u):$(id -g)" build 2>/dev/null || true
          chmod -R u+rwX build 2>/dev/null || true

          PROJ=$(
            find build \
              -type d \
              -name "*.xcodeproj" \
              -print 2>/dev/null \
              | head -1
          )

          if [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "XCODE_PROJECT_FOUND=$PROJ"
            find "$(dirname "$PROJ")" -maxdepth 2 -type f | head -160 || true
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project was generated after two attempts."
          fi

      - name: Set final Unity result
        id: final_unity
        if: always()
        run: |
          if [ "${{ steps.detect_xcode.outputs.ready }}" = "true" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "FINAL UNITY RESULT: success"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "FINAL UNITY RESULT: failure"
          fi

      - name: Collect Unity build diagnostics
        if: always() && steps.detect_xcode.outputs.ready != 'true'
        run: |
          set +e

          mkdir -p unity-build-diagnostics

          {
            echo "V11_SCENE_PATH_FIX=true"
            echo "ATTEMPT1_OUTCOME=${{ steps.unity_build_1.outcome }}"
            echo "ATTEMPT1_ENGINE_EXIT=${{ steps.unity_build_1.outputs.engineExitCode }}"
            echo "ATTEMPT2_OUTCOME=${{ steps.unity_build_2.outcome }}"
            echo "ATTEMPT2_ENGINE_EXIT=${{ steps.unity_build_2.outputs.engineExitCode }}"
            echo "XCODE_READY=${{ steps.detect_xcode.outputs.ready }}"
            echo "PROJECT=${{ steps.prepare_ios.outputs.project_path }}"
            echo "UNITY_VERSION=${{ steps.prepare_ios.outputs.unity_version }}"
            echo "UNITY_CHANGESET=${{ steps.prepare_ios.outputs.unity_changeset }}"
          } > unity-build-diagnostics/summary.txt

          echo "===== FIND UNITY / CRASH LOGS ====="

          for LOG in unity-attempt1.log unity-attempt2.log; do
            if [ -s "$LOG" ]; then
              cp "$LOG" "unity-build-diagnostics/$LOG" || true
            fi
          done

          PROJECT="${{ steps.prepare_ios.outputs.project_path }}"

          for BASE in \
            "$HOME/.local/share/unity3d" \
            "$HOME/.config/unity3d" \
            "$PROJECT" \
            build \
            "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" \
            /tmp
          do
            [ -e "$BASE" ] || continue

            sudo find "$BASE" \
              -type f \
              \( -iname "*.log" \
                 -o -iname "Editor.log" \
                 -o -iname "core" \
                 -o -iname "core.*" \
                 -o -iname "*.dmp" \) \
              -size -20M \
              -print 2>/dev/null \
              | head -240
          done > unity-build-diagnostics/log-files.txt || true

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue

            SAFE_NAME=$(
              echo "$FILE" \
                | sed 's#^/##; s#[/ ]#_#g'
            )

            sudo cp "$FILE" \
              "unity-build-diagnostics/$SAFE_NAME" \
              2>/dev/null || true
          done < unity-build-diagnostics/log-files.txt

          if [ -d "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" ]; then
            mkdir -p unity-build-diagnostics/GameCI-UnityDiagnostics
            cp -a "$GITHUB_WORKSPACE/Logs/UnityDiagnostics"/.               unity-build-diagnostics/GameCI-UnityDiagnostics/ 2>/dev/null || true
          fi

          if [ -d "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" ]; then
            mkdir -p unity-build-diagnostics/GameCI-UnityDiagnostics
            cp -a "$GITHUB_WORKSPACE/Logs/UnityDiagnostics"/. \
              unity-build-diagnostics/GameCI-UnityDiagnostics/ 2>/dev/null || true
          fi

          if [ -d v17-backup ]; then
            mkdir -p unity-build-diagnostics/v17-backup
            cp -a v17-backup/. unity-build-diagnostics/v17-backup/ 2>/dev/null || true
          fi

          sudo chown -R "$(id -u):$(id -g)" unity-build-diagnostics || true
          chmod -R u+rwX unity-build-diagnostics || true

          grep -RniE \
            'SIGABRT|Aborted|Caught fatal signal|Assertion failed|AudioManager|FMOD|error CS[0-9]+|Compilation failed|compiler error|Exception|error:|failed|FAILURE|did the Editor crash' \
            unity-build-diagnostics \
            > unity-build-diagnostics/important-errors.txt \
            2>/dev/null || true

          echo "===== IMPORTANT UNITY ERRORS ====="
          tail -320 unity-build-diagnostics/important-errors.txt || true

      - name: Upload Unity iOS Xcode result
        if: steps.detect_xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-iOS-Xcode-v11-FAST
          path: build
          compression-level: 0

      - name: Upload Unity build diagnostics
        if: steps.detect_xcode.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-Unity-Build-Diagnostics-v11
          path: unity-build-diagnostics
          if-no-files-found: ignore
          compression-level: 0

      - name: Show exact Unity failure
        if: always() && steps.detect_xcode.outputs.ready != 'true'
        run: |
          echo "=================================================="
          echo "SONIC P-06 RELEASE v11 FAST - EXACT UNITY FAILURE"
          echo "Unity: ${{ steps.prepare_ios.outputs.unity_version }}"
          echo "Attempt 1: ${{ steps.unity_build_1.outcome }} / engine=${{ steps.unity_build_1.outputs.engineExitCode }}"
          echo "Attempt 2: ${{ steps.unity_build_2.outcome }} / engine=${{ steps.unity_build_2.outputs.engineExitCode }}"
          echo "=================================================="

          if [ -f unity-build-diagnostics/important-errors.txt ]; then
            tail -220 unity-build-diagnostics/important-errors.txt
          else
            echo "important-errors.txt was not produced."
          fi

          echo
          echo "Artifact: Sonic-P06-Sonic-Release-Unity-Build-Diagnostics-v11"
          exit 1

  make_ipa:
    name: 2. Make Signulous IPA
    needs: build_sonic_ios
    if: needs.build_sonic_ios.outputs.xcode_ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Download Unity Xcode project
        uses: actions/download-artifact@v4
        with:
          name: Sonic-P06-iOS-Xcode-v11-FAST
          path: unity-ios

      - name: Patch old Unity 2018 headers for current Xcode
        run: |
          set -e

          find unity-ios -type f \
            \( -name "UnityInterface.h" -o -name "UnityRendering.h" \) \
            -print \
            | while read -r FILE; do
                if ! grep -q "<stdbool.h>" "$FILE"; then
                  printf '#include <stdbool.h>\n' | cat - "$FILE" > "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                fi
              done

      - name: Restore Unity script permissions
        run: |
          set -e
          find unity-ios -type f -name "*.sh" -print -exec chmod +x {} \;
          xattr -cr unity-ios 2>/dev/null || true

      - name: Patch Xcode project for missing movies and modern Xcode
        run: |
          set -euo pipefail

          echo "===== XCODE v10 FAST PRECHECK ====="

          PROJ=$(find unity-ios -type d -name "*.xcodeproj" | head -1)
          if [ -z "$PROJ" ]; then
            echo "ERROR: Unity Xcode project not found."
            exit 1
          fi

          PBX="$PROJ/project.pbxproj"
          test -f "$PBX"

          echo "===== VIDEO FILES EXPORTED BY UNITY ====="
          find unity-ios -type f \
            \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.m4v" \
               -o -iname "*.webm" -o -iname "*.ogv" -o -iname "*.avi" \) \
            -printf '%p  %s bytes\n' 2>/dev/null \
            | sort \
            | tee xcode-video-files.txt || true

          echo "===== ZERO/TINY VIDEO FILES ====="
          find unity-ios -type f \
            \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.m4v" \
               -o -iname "*.webm" -o -iname "*.ogv" -o -iname "*.avi" \) \
            -size -2048c \
            -printf '%p  %s bytes\n' 2>/dev/null \
            | tee xcode-broken-videos.txt || true

          # AssetRipper can recover a scene while failing to recover one or more
          # movie assets. Xcode then keeps references to files that do not exist.
          # Remove ONLY missing/empty movie references from project.pbxproj.
          python3 - "$PBX" <<'PY'
          import os, re, sys
          from pathlib import Path

          pbx = Path(sys.argv[1])
          root = pbx.parent.parent
          data = pbx.read_text(errors="ignore")
          lines = data.splitlines(True)

          video_exts = (".mp4", ".mov", ".m4v", ".webm", ".ogv", ".avi")

          # Basenames that actually exist and are non-empty.
          existing = {}
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in video_exts:
                  try:
                      if p.stat().st_size > 2048:
                          existing.setdefault(p.name.lower(), []).append(p)
                  except OSError:
                      pass

          missing_file_refs = set()
          missing_names = set()

          # PBXFileReference lines are normally one physical line.
          ref_re = re.compile(
              r'^\s*([0-9A-Fa-f]{24}) /\* (.*?) \*/ = '
              r'\{isa = PBXFileReference;.*?path = (.*?);.*?\};'
          )

          for line in lines:
              m = ref_re.search(line)
              if not m:
                  continue
              uid, comment, raw_path = m.groups()
              name = comment.strip().strip('"')
              raw_path = raw_path.strip().strip('"')
              candidate_name = os.path.basename(raw_path or name)

              if candidate_name.lower().endswith(video_exts):
                  if candidate_name.lower() not in existing:
                      missing_file_refs.add(uid)
                      missing_names.add(candidate_name)

          # PBXBuildFile entries referencing the bad PBXFileReference UUIDs.
          bad_build_refs = set()
          for line in lines:
              m = re.search(
                  r'^\s*([0-9A-Fa-f]{24}) /\* .*? \*/ = '
                  r'\{isa = PBXBuildFile; fileRef = ([0-9A-Fa-f]{24}) ',
                  line,
              )
              if m and m.group(2) in missing_file_refs:
                  bad_build_refs.add(m.group(1))

          bad_ids = missing_file_refs | bad_build_refs

          if bad_ids:
              backup = pbx.with_suffix(".pbxproj.v6-backup")
              backup.write_text(data)

              kept = []
              for line in lines:
                  if any(uid in line for uid in bad_ids):
                      continue
                  kept.append(line)

              pbx.write_text("".join(kept))

          report = Path("xcode-missing-movie-pbxrefs.txt")
          report.write_text(
              "Missing/broken movie names:\\n" +
              "\\n".join(sorted(missing_names)) +
              "\\n\\nRemoved PBX UUIDs:\\n" +
              "\\n".join(sorted(bad_ids)) +
              "\\n"
          )

          print("Missing movie refs:", len(missing_file_refs))
          print("PBX entries removed:", len(bad_ids))
          for n in sorted(missing_names):
              print("  removed missing movie:", n)
          PY

          echo "===== SHELL SCRIPT PERMISSIONS ====="
          find unity-ios -type f -name "*.sh" -exec chmod +x {} \;

          echo "===== PATCH RESULT ====="
          cat xcode-missing-movie-pbxrefs.txt || true

      - name: Build unsigned arm64 app
        run: |
          set -uo pipefail

          PROJ=$(find unity-ios -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJ" ]; then
            echo "ERROR: Unity Xcode project not found."
            find unity-ios -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJ"
          echo "===== XCODE VERSION ====="
          xcodebuild -version

          echo "===== XCODE PROJECT SCHEMES ====="
          xcodebuild -project "$PROJ" -list || true

          SCHEME="Unity-iPhone"

          if ! xcodebuild -project "$PROJ" -list 2>/dev/null \
                | grep -A50 "Schemes:" \
                | grep -qE '^[[:space:]]*Unity-iPhone[[:space:]]*$'; then
            DETECTED_SCHEME=$(
              xcodebuild -project "$PROJ" -list 2>/dev/null \
                | awk '
                    /Schemes:/ {in_schemes=1; next}
                    in_schemes && NF {
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
                      print
                      exit
                    }
                  '
            )
            if [ -n "$DETECTED_SCHEME" ]; then
              SCHEME="$DETECTED_SCHEME"
            fi
          fi

          echo "XCODE_SCHEME=$SCHEME"

          rm -rf "$PWD/DerivedData"

          echo "===== XCODE BUILD ATTEMPT 1 ====="
          set +e
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="com.sonicp06.release.ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build \
            2>&1 | tee xcodebuild-attempt1.log
          CODE1=${PIPESTATUS[0]}
          set -e

          echo "ATTEMPT1_EXIT=$CODE1"

          if [ "$CODE1" -ne 0 ]; then
            echo
            echo "===== EXACT XCODE ERRORS - ATTEMPT 1 ====="
            grep -nEi \
              '(^|[[:space:]])(error:|fatal error:)|undefined symbols|duplicate symbol|command .* failed|phasescriptexecution|permission denied|build input file cannot be found|no such file or directory|clang: error|ld: ' \
              xcodebuild-attempt1.log \
              | tail -250 \
              | tee xcode-errors-attempt1.txt || true

            echo
            echo "===== RETRY PREP ====="
            find unity-ios -type f -name "*.sh" -exec chmod +x {} \;
            xattr -cr unity-ios 2>/dev/null || true
            rm -rf "$PWD/DerivedData"

            echo "===== XCODE BUILD ATTEMPT 2 - COMPATIBILITY MODE ====="
            set +e
            xcodebuild \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$PWD/DerivedData" \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=NO \
              IPHONEOS_DEPLOYMENT_TARGET=15.0 \
              PRODUCT_BUNDLE_IDENTIFIER="com.sonicp06.release.ios" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              CLANG_WARN_DOCUMENTATION_COMMENTS=NO \
              CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              -jobs 1 \
              build \
              2>&1 | tee xcodebuild-attempt2.log
            CODE2=${PIPESTATUS[0]}
            set -e

            echo "ATTEMPT2_EXIT=$CODE2"

            if [ "$CODE2" -ne 0 ]; then
              echo
              echo "===== EXACT XCODE ERRORS - ATTEMPT 2 ====="
              grep -nEi \
                '(^|[[:space:]])(error:|fatal error:)|undefined symbols|duplicate symbol|command .* failed|phasescriptexecution|permission denied|build input file cannot be found|no such file or directory|clang: error|ld: ' \
                xcodebuild-attempt2.log \
                | tail -300 \
                | tee xcode-errors-attempt2.txt || true

              {
                echo "===== ATTEMPT 1 ====="
                cat xcode-errors-attempt1.txt 2>/dev/null || true
                echo
                echo "===== ATTEMPT 2 ====="
                cat xcode-errors-attempt2.txt 2>/dev/null || true
              } > xcode-errors-final.txt

              echo
              echo "===== FINAL XCODE FAILURE SUMMARY ====="
              cat xcode-errors-final.txt
              exit "$CODE2"
            fi
          fi

          echo "===== XCODE BUILD SUCCEEDED ====="
          find DerivedData -type d -name "*.app" -print

      - name: Locate app and create Signulous-ready IPA
        run: |
          set -e

          APP=$(find DerivedData -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found."
            exit 1
          fi

          rm -rf Payload output
          mkdir -p Payload output

          cp -R "$APP" Payload/

          # Signulous will perform the real signing on the iPhone.
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/Sonic-P06-Sonic-Release-iOS-v10-FAST.ipa

          ls -lh output/Sonic-P06-Sonic-Release-iOS-v10-FAST.ipa

      - name: Upload Sonic iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-iOS-v10-FAST
          path: |
            output/Sonic-P06-Sonic-Release-iOS-v10-FAST.ipa
            xcodebuild-attempt1.log
            xcodebuild-attempt2.log
            xcode-missing-movie-pbxrefs.txt
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Xcode failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Xcode-FAIL-v10-FAST
          path: |
            xcodebuild-attempt1.log
            xcodebuild-attempt2.log
            xcode-errors-attempt1.txt
            xcode-errors-attempt2.txt
            xcode-errors-final.txt
            xcode-video-files.txt
            xcode-broken-videos.txt
            xcode-missing-movie-pbxrefs.txt
          if-no-files-found: ignore
          compression-level: 0
