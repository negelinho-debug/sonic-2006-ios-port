name: Sonic 2006 - FETCH v15 FULL LOG

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fetch_v15_unity_log:
    name: Fetch previous v15 Unity crash log
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download v15 Unity job log with curl
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_JOB_ID: "102034308734"
        run: |
          set -euo pipefail

          mkdir -p full-unity-log

          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "UNITY_JOB_ID=$UNITY_JOB_ID"

          HTTP_CODE=$(
            curl \
              --location \
              --silent \
              --show-error \
              --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o full-unity-log/Unity-build-job.log \
              -w "%{http_code}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$UNITY_JOB_ID/logs"
          )

          echo "HTTP_CODE=$HTTP_CODE" | tee full-unity-log/http.txt

          test -s full-unity-log/Unity-build-job.log

          echo "===== LOG SIZE ====="
          wc -c full-unity-log/Unity-build-job.log
          wc -l full-unity-log/Unity-build-job.log || true

          echo "===== IMPORTANT ERRORS ====="
          grep -a -niE \
            'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Aborting batchmode|SIGABRT|Caught fatal signal|Assertion failed|AudioManager|FMOD|Exception|Fatal error|Build failed|exit code 134|did the Editor crash|Crash|abort|AssetImport|API Updater' \
            full-unity-log/Unity-build-job.log \
            | tail -800 \
            | tee full-unity-log/important-errors.txt \
            || true

          echo "===== LAST 1000 LINES ====="
          tail -1000 full-unity-log/Unity-build-job.log \
            > full-unity-log/tail-1000.txt \
            || true

      - name: Upload recovered v15 full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-RECOVERED-FULL-Unity-Log-v15
          path: full-unity-log
          if-no-files-found: warn
          compression-level: 0
