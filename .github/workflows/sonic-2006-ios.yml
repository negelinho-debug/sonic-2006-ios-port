name: Sonic 2006 iOS - FAST v19

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package_existing_xcode:
    name: Fix Xcode permissions + build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Find latest v18 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" \
              --jq '.workflow_runs[]
                    | select(.name == "Sonic 2006 iOS - NO PC v18")
                    | .id' \
              | head -1
          )

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find a v18 run."
            exit 1
          fi

          echo "V18_RUN_ID=$RUN_ID"
          echo "V18_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download existing Unity Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf unity-ios
          mkdir -p unity-ios

          gh run download "$V18_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Sonic-2006-iOS-Xcode" \
            --dir unity-ios

          echo "===== XCODE PROJECT ====="
          find unity-ios -type d -name "*.xcodeproj" -print

      - name: Patch Unity 2018 project for current Xcode
        run: |
          set -euo pipefail

          echo "===== FIX OLD UNITY HEADERS ====="
          find unity-ios -type f \
            \( -name "UnityInterface.h" -o -name "UnityRendering.h" \) \
            -print \
            | while read -r FILE; do
                if ! grep -q "<stdbool.h>" "$FILE"; then
                  printf '#include <stdbool.h>\n' | cat - "$FILE" > "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                fi
              done

          echo "===== V19 FIX: RESTORE EXECUTABLE BIT ON UNITY SCRIPTS ====="
          find unity-ios -type f -name "*.sh" -print -exec chmod +x {} \;

          MAP_SCRIPT=$(find unity-ios -type f -name "MapFileParser.sh" | head -1 || true)

          if [ -z "$MAP_SCRIPT" ]; then
            echo "ERROR: MapFileParser.sh not found."
            exit 1
          fi

          echo "MAP_SCRIPT=$MAP_SCRIPT"
          ls -l "$MAP_SCRIPT"
          test -x "$MAP_SCRIPT"

      - name: Build unsigned arm64 app
        run: |
          set -euo pipefail
          set -o pipefail

          PROJ=$(find unity-ios -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJ" ]; then
            echo "ERROR: Unity Xcode project not found."
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJ"
          echo "===== AVAILABLE SCHEMES ====="
          xcodebuild -project "$PROJ" -list || true

          SCHEME="Unity-iPhone"

          if ! xcodebuild -project "$PROJ" -list 2>/dev/null \
                | grep -A50 "Schemes:" \
                | grep -qE '^[[:space:]]*Unity-iPhone[[:space:]]*$'; then
            DETECTED_SCHEME=$(
              xcodebuild -project "$PROJ" -list 2>/dev/null \
                | awk '
                    /Schemes:/ {in_schemes=1; next}
                    in_schemes && NF {
                      gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
                      print
                      exit
                    }
                  '
            )

            if [ -n "$DETECTED_SCHEME" ]; then
              SCHEME="$DETECTED_SCHEME"
            fi
          fi

          echo "XCODE_SCHEME=$SCHEME"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="com.sonic2006.ios.port" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild-v19.log

      - name: Create KSign IPA
        run: |
          set -euo pipefail

          APP=$(find DerivedData/Build/Products -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found."
            find DerivedData/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          echo "APP=$APP"
          du -sh "$APP"

          rm -rf Payload output
          mkdir -p Payload output

          cp -R "$APP" Payload/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/Sonic-2006-iOS-KSign-v19.ipa

          echo "===== IPA READY ====="
          ls -lh output/Sonic-2006-iOS-KSign-v19.ipa

      - name: Upload Sonic iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-iOS-KSign-v19
          path: |
            output/Sonic-2006-iOS-KSign-v19.ipa
            xcodebuild-v19.log
          compression-level: 0

      - name: Upload Xcode v19 failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-Xcode-FAIL-v19
          path: xcodebuild-v19.log
          if-no-files-found: ignore
          compression-level: 0
