name: Sonic P-06 Sonic Release iOS - v1

on:
  workflow_dispatch:
    inputs:
      try_ios_build:
        description: "Try Unity iOS build after recovery"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Recover Unity project
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip curl jq xz-utils
          rm -rf work tools recovered output release-files
          mkdir -p work tools recovered output release-files

      - name: Download newest Sonic Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "===== NEWEST GITHUB RELEASE ====="
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$TAG" ]; then
            echo "ERROR: no GitHub Release found."
            exit 1
          fi

          echo "TAG=$TAG"
          gh release view "$TAG"

          rm -rf release-files
          mkdir -p release-files

          gh release download "$TAG" \
            --dir release-files \
            --pattern "*.apk"

          echo "===== APK ASSETS ====="
          find release-files -type f -iname "*.apk" -printf '%p  %s bytes\n' | sort

          APK=$(find release-files -type f -iname "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: newest Release has no .apk asset."
            exit 1
          fi

          # If there are multiple APKs, use the largest one: the full Sonic Release
          # should be much larger than an old demo.
          APK=$(
            find release-files -type f -iname "*.apk" -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )

          echo "SELECTED_APK=$APK"
          echo "APK=$APK" | tee output/apk-path.txt

          cp "$APK" work/SonicP06Release.apk
          ls -lh work/SonicP06Release.apk

      - name: Extract and inspect new Sonic Release
        run: |
          set -e

          mkdir -p work/android
          unzip -q work/SonicP06Release.apk -d work/android

          test -f work/android/assets/bin/Data/globalgamemanagers
          test -f work/android/assets/bin/Data/level0

          VERSION=$(
            strings work/android/assets/bin/Data/globalgamemanagers \
              | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
              | head -1 || true
          )

          echo "UNITY_VERSION=$VERSION" | tee output/unity-version.txt

          if [ -f work/android/assets/bin/Data/Managed/Assembly-CSharp.dll ]; then
            echo "SCRIPT_BACKEND=MONO" | tee output/script-backend.txt
            echo "===== MANAGED CODE ====="
            ls -lh work/android/assets/bin/Data/Managed/Assembly-CSharp.dll

            strings work/android/assets/bin/Data/Managed/Assembly-CSharp.dll \
              | grep -E 'VirtualJoystick|AButton|BButton|XButton|YButton|StartButton|BackButton|GameInput|XInput|GamePad' \
              | sort -u \
              | tee output/mobile-input-markers.txt || true
          elif find work/android -type f -name global-metadata.dat -print -quit | grep -q .; then
            echo "SCRIPT_BACKEND=IL2CPP" | tee output/script-backend.txt
            find work/android -type f \
              \( -name "global-metadata.dat" -o -name "libil2cpp.so" \) \
              -print | tee output/il2cpp-files.txt
          else
            echo "SCRIPT_BACKEND=UNKNOWN" | tee output/script-backend.txt
          fi

          echo "===== ANDROID NATIVE LIBS ====="
          find work/android/lib -maxdepth 2 -type f -print || true

          echo "===== SCENE FILES IN APK ====="
          find work/android/assets/bin/Data -maxdepth 1 -type f -name 'level*' \
            -printf '%f  %s bytes\n' \
            | sort -V \
            | tee output/apk-scenes.txt || true

          # Our proven old-Sonic CI route uses Unity 2018.2.0f2. If this release
          # uses another editor, stop immediately instead of wasting hours.
          if [ "$VERSION" != "2018.2.0f2" ]; then
            echo
            echo "NEW BUILD DETECTED: Unity $VERSION"
            echo "This first-run YAML stopped early on purpose."
            echo "Send the UNITY_VERSION line and we can swap the editor version."
            exit 1
          fi

          if [ ! -f work/android/assets/bin/Data/Managed/Assembly-CSharp.dll ]; then
            echo
            echo "This APK is not the same Mono layout as the old demo."
            echo "Detected backend: $(cut -d= -f2 output/script-backend.txt)"
            echo "Stopping early so we do not waste a 2-3 hour Unity build."
            exit 1
          fi

      - name: Download AssetRipper 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "===== ASSETRIPPER 2.0.0 RELEASE ASSETS ====="

          gh api \
            repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' \
            | tee output/assetripper-assets.txt

          ASSET=$(
            grep -Ei \
              '^AssetRipper_linux_(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
              output/assetripper-assets.txt \
              | head -1
          )

          if [ -z "$ASSET" ]; then
            ASSET=$(
              grep -Ei \
                'linux.*(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
                output/assetripper-assets.txt \
                | head -1
            )
          fi

          if [ -z "$ASSET" ]; then
            echo "ERROR: no Linux x64 AssetRipper archive found in release 2.0.0"
            cat output/assetripper-assets.txt
            exit 1
          fi

          echo "SELECTED_ASSET=$ASSET"

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p "$ASSET" \
            -D tools

          ARCHIVE="tools/$ASSET"
          test -s "$ARCHIVE"

          mkdir -p tools/assetripper

          case "$ARCHIVE" in
            *.tar.xz)
              tar -xJf "$ARCHIVE" -C tools/assetripper
              ;;
            *.zip)
              unzip -q "$ARCHIVE" -d tools/assetripper
              ;;
            *)
              echo "ERROR: unsupported AssetRipper archive: $ARCHIVE"
              exit 1
              ;;
          esac

          echo "===== ASSETRIPPER FILES ====="
          find tools/assetripper -maxdepth 4 -type f -print | head -200

          RIPPER=$(
            find tools/assetripper \
              -type f \
              \( -name "AssetRipper.GUI.Free" \
                 -o -name "AssetRipper.GUI.Free.exe" \
                 -o -name "AssetRipper.GUI" \
                 -o -name "AssetRipper" \) \
              | head -1
          )

          if [ -z "$RIPPER" ]; then
            echo "ERROR: AssetRipper executable not found after extraction"
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "$RIPPER" > output/assetripper-path.txt

          echo "ASSETRIPPER=$RIPPER"
          "$RIPPER" --help | head -120 || true

      - name: Recover Unity project with AssetRipper
        run: |
          set -e

          RIPPER=$(cat output/assetripper-path.txt)
          PORT=3333

          "$RIPPER" \
            --headless \
            --port "$PORT" \
            > output/assetripper.log 2>&1 &

          RIPPER_PID=$!
          echo "$RIPPER_PID" > output/assetripper.pid

          READY=0

          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: AssetRipper web service did not start."
            tail -200 output/assetripper.log || true
            exit 1
          fi

          DATA_DIR="$PWD/work/android/assets/bin/Data"
          EXPORT_DIR="$PWD/recovered/SonicP06Release"

          mkdir -p "$EXPORT_DIR"

          echo "===== FIX405 ACTIVE ====="
          echo "===== LOAD UNITY DATA ====="

          LOAD_CODE=$(
            curl -sS \
              -o output/loadfolder-response.txt \
              -w "%{http_code}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "Path=$DATA_DIR" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )

          echo "LOADFOLDER_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "302" ] && [ "$LOAD_CODE" != "200" ]; then
            echo "ERROR: AssetRipper /LoadFolder returned HTTP $LOAD_CODE"
            echo "===== RESPONSE ====="
            cat output/loadfolder-response.txt || true
            echo "===== ASSETRIPPER LOG ====="
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "===== EXPORT UNITY PROJECT ====="

          EXPORT_CODE=$(
            curl -sS \
              -o output/export-response.txt \
              -w "%{http_code}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "Path=$EXPORT_DIR" \
              --data-urlencode "CreateSubfolder=false" \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )

          echo "EXPORT_HTTP=$EXPORT_CODE"

          if [ "$EXPORT_CODE" != "302" ] && [ "$EXPORT_CODE" != "200" ]; then
            echo "ERROR: AssetRipper /Export/UnityProject returned HTTP $EXPORT_CODE"
            echo "===== RESPONSE ====="
            cat output/export-response.txt || true
            echo "===== ASSETRIPPER LOG ====="
            tail -250 output/assetripper.log || true
            exit 1
          fi

          kill "$RIPPER_PID" 2>/dev/null || true
          wait "$RIPPER_PID" 2>/dev/null || true

          echo "===== RECOVERED ROOT ====="
          find "$EXPORT_DIR" -maxdepth 3 -type d | head -180

          PROJECT=""

          if [ -d "$EXPORT_DIR/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT_DIR/ExportedProject"
          elif [ -d "$EXPORT_DIR/Assets" ]; then
            PROJECT="$EXPORT_DIR"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: AssetRipper did not export a Unity Assets/ directory"
            tail -250 output/assetripper.log || true
            exit 1
          fi

          if [ ! -d "$PROJECT/ProjectSettings" ]; then
            echo "ERROR: AssetRipper did not export ProjectSettings/"
            tail -250 output/assetripper.log || true
            exit 1
          fi

          echo "$PROJECT" > output/recovered-project-path.txt
          echo "RECOVERED_PROJECT=$PROJECT"

      - name: Prepare recovered project for iOS
        run: |
          set -e

          PROJECT=$(cat output/recovered-project-path.txt)

          mkdir -p output/original-managed
          cp \
            work/android/assets/bin/Data/Managed/Assembly-CSharp.dll \
            output/original-managed/Assembly-CSharp.dll

          # Android native binaries cannot run on iOS.
          # Keep a report, but remove Android-only plugins from the Unity project.
          find "$PROJECT/Assets" \
            -type f \
            \( -iname "*.so" -o -iname "*.aar" -o -iname "*.jar" \) \
            -print \
            | tee output/removed-android-plugins.txt || true

          find "$PROJECT/Assets" \
            -type f \
            \( -iname "*.so" -o -iname "*.aar" -o -iname "*.jar" \) \
            -delete || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true

          echo "===== V17 FIX: REMOVE DUPLICATE UNITY ENGINE MODULE ====="
          mkdir -p output

          # v16 full log proved that Unity 2018.2 already provides:
          # /opt/unity/Editor/Data/Managed/UnityEngine/UnityEngine.SpatialTrackingModule.dll
          # AssetRipper also exported a second copy into Assets/Plugins, which causes CS1704.
          find "$PROJECT/Assets/Plugins"             -type f             \( -name "UnityEngine.SpatialTrackingModule.dll"                -o -name "UnityEngine.SpatialTrackingModule.dll.meta"                -o -name "UnityEngine.SpatialTrackingModule.dll.mdb"                -o -name "UnityEngine.SpatialTrackingModule.pdb" \)             -print             | tee output/removed-duplicate-spatialtracking.txt             || true

          find "$PROJECT/Assets/Plugins"             -type f             \( -name "UnityEngine.SpatialTrackingModule.dll"                -o -name "UnityEngine.SpatialTrackingModule.dll.meta"                -o -name "UnityEngine.SpatialTrackingModule.dll.mdb"                -o -name "UnityEngine.SpatialTrackingModule.pdb" \)             -delete             || true

          if find "$PROJECT/Assets/Plugins" -type f                -name "UnityEngine.SpatialTrackingModule.dll"                -print -quit | grep -q .; then
            echo "ERROR: duplicate SpatialTrackingModule DLL still exists"
            exit 1
          fi

          echo "Duplicate SpatialTrackingModule removed."

          mkdir -p "$PROJECT/ProjectSettings"

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 2018.2.0f2
          m_EditorVersionWithRevision: 2018.2.0f2 (787658998520)
          EOF

          echo "===== V16 FIX: UNITY 2018.2 C# COMPILER ====="

          PLAYER_SETTINGS="$PROJECT/ProjectSettings/ProjectSettings.asset"

          if [ -f "$PLAYER_SETTINGS" ]; then
            # The recovered Android project is using the legacy .NET 3.5
            # scripting runtime. That forces Unity to compile Editor scripts
            # with "-langversion:4". GameCI's injected Builder.cs uses C# 7
            # syntax (out-variable declarations), so the Builder never exists.
            #
            # Switch the project to the newer .NET 4.x-equivalent runtime
            # BEFORE Unity starts. 2018.2 supports this runtime.
            if grep -qE '^[[:space:]]*(m_)?scriptingRuntimeVersion:' "$PLAYER_SETTINGS"; then
              sed -Ei                 's/^([[:space:]]*)((m_)?scriptingRuntimeVersion):.*/\1\2: 1/'                 "$PLAYER_SETTINGS"
            else
              sed -i                 '/^PlayerSettings:$/a\  scriptingRuntimeVersion: 1'                 "$PLAYER_SETTINGS"
            fi

            echo "Patched scripting runtime:"
            grep -nE 'scriptingRuntimeVersion' "$PLAYER_SETTINGS" || true
          else
            echo "WARNING: ProjectSettings.asset not found; using compiler response-file fallback."
          fi

          # Unity 2018.2 can still invoke mcs for some assemblies.  Its
          # experimental language mode supports the C# 7 syntax used by the
          # GameCI build action.  If the newer runtime selects csc instead,
          # csc.rsp requests the newest language version available there.
          cat > "$PROJECT/Assets/mcs.rsp" <<'EOF'
          -langversion:experimental
          EOF

          cat > "$PROJECT/Assets/csc.rsp" <<'EOF'
          -langversion:latest
          EOF

          echo "===== COMPILER RESPONSE FILES ====="
          cat "$PROJECT/Assets/mcs.rsp"
          cat "$PROJECT/Assets/csc.rsp"

          echo "===== C# FILES ====="
          find "$PROJECT/Assets" -type f -name "*.cs" | wc -l | tee output/csharp-count.txt

          echo "===== SCENES ====="
          find "$PROJECT/Assets" -type f -name "*.unity" \
            | sort \
            | tee output/scenes.txt

          echo "===== ANDROID-SPECIFIC C# REFERENCES ====="
          grep -RniE \
            'AndroidJava|RuntimePlatform\.Android|UNITY_ANDROID|GooglePlay|AdMob|BillingClient' \
            "$PROJECT/Assets" \
            --include="*.cs" \
            | head -200 \
            | tee output/android-csharp-references.txt || true

          echo "===== TOUCH / MOBILE REFERENCES ====="
          grep -RniE \
            'VirtualJoystick|Touch|AButton|BButton|XButton|YButton|StartButton|BackButton' \
            "$PROJECT/Assets" \
            --include="*.cs" \
            | head -250 \
            | tee output/touch-csharp-references.txt || true

          echo "===== V24 CONTROLLER BACKEND DISCOVERY ====="
          mkdir -p output
          : > output/v24-controller-backends.txt

          grep -RniE             "XInputDotNetPure|GamePad\\.GetState|GamePadState|PlayerIndex|XInput|Rewired|InControl|ControllerInput|InputManager|Joystick|Gamepad"             "$PROJECT/Assets/Scripts" "$PROJECT/Assets"             --include="*.cs"             2>/dev/null             | head -500             | tee output/v24-controller-backends.txt || true

          echo "===== V24 FIX: IOS TOUCH / BUTTON INPUT ====="
          mkdir -p output
          : > output/v24-input-patched-files.txt

          # 1) Re-enable mobile code that was Android-gated in recovered sources.
          # 2) Route Unity Input button/key/axis reads through an iOS touch bridge.
          PROJECT="$PROJECT" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          root = project / "Assets" / "Scripts" / "Assembly-CSharp"
          report = Path("output/v24-input-patched-files.txt")

          if not root.exists():
              root = project / "Assets"

          markers = re.compile(
              r"VirtualJoystick|Touch|AButton|BButton|XButton|YButton|"
              r"StartButton|BackButton|GameInput|Input\.GetButton|Input\.GetAxis|"
              r"Input\.GetKey|RuntimePlatform\.Android|UNITY_ANDROID",
              re.I,
          )

          api_calls = [
              "GetButtonDown", "GetButtonUp", "GetButton",
              "GetAxisRaw", "GetAxis",
              "GetKeyDown", "GetKeyUp", "GetKey",
          ]

          changed = []

          xinput_refs = []
          for probe in root.rglob("*.cs"):
              try:
                  probe_text = probe.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if ("XInputDotNetPure" in probe_text or
                  "GamePad.GetState" in probe_text or
                  "GamePadState" in probe_text or
                  "PlayerIndex" in probe_text):
                  xinput_refs.append(str(probe))

          Path("output/v24-xinput-source-files.txt").write_text(
              "\n".join(xinput_refs) + ("\n" if xinput_refs else "")
          )
          print("XInput-looking source files:", len(xinput_refs))

          for path in root.rglob("*.cs"):
              if path.name in {"IOSInputBridge.cs"}:
                  continue

              try:
                  original = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              s = original

              # Sonic 06 PC-style conversions commonly use XInputDotNetPure
              # instead of UnityEngine.Input. Route GamePad calls to our iOS
              # controller shim while preserving the original GamePadState API.
              if ("XInputDotNetPure" in original or
                  "GamePad.GetState" in original or
                  "GamePadState" in original or
                  "PlayerIndex" in original):
                  s = re.sub(
                      r"XInputDotNetPure\.GamePad\.GetState\s*\(",
                      "IOSXInputGamePad.GetState(",
                      s,
                  )
                  s = re.sub(
                      r"(?<![\w.])GamePad\.GetState\s*\(",
                      "IOSXInputGamePad.GetState(",
                      s,
                  )
                  s = re.sub(
                      r"XInputDotNetPure\.GamePad\.SetVibration\s*\(",
                      "IOSXInputGamePad.SetVibration(",
                      s,
                  )
                  s = re.sub(
                      r"(?<![\w.])GamePad\.SetVibration\s*\(",
                      "IOSXInputGamePad.SetVibration(",
                      s,
                  )

              # Route classic Unity input through the bridge. The bridge always
              # delegates to the original Unity Input first, so keyboard/gamepad
              # behaviour remains available.
              for name in api_calls:
                  s = re.sub(
                      rf"UnityEngine\.Input\.{name}\s*\(",
                      f"IOSInputBridge.{name}(",
                      s,
                  )
                  s = re.sub(
                      rf"(?<![\w.])Input\.{name}\s*\(",
                      f"IOSInputBridge.{name}(",
                      s,
                  )

              s = re.sub(
                  r"(?<![\w.])Input\.anyKeyDown\b",
                  "IOSInputBridge.AnyKeyDown",
                  s,
              )
              s = re.sub(
                  r"UnityEngine\.Input\.anyKeyDown\b",
                  "IOSInputBridge.AnyKeyDown",
                  s,
              )

              if markers.search(original):
                  # The original mobile conversion contains Android-only
                  # platform gates. Treat iPhonePlayer as the same mobile path.
                  s = re.sub(
                      r"Application\.platform\s*==\s*RuntimePlatform\.Android",
                      "(Application.platform == RuntimePlatform.Android || "
                      "Application.platform == RuntimePlatform.IPhonePlayer)",
                      s,
                  )
                  s = re.sub(
                      r"RuntimePlatform\.Android\s*==\s*Application\.platform",
                      "(Application.platform == RuntimePlatform.Android || "
                      "Application.platform == RuntimePlatform.IPhonePlayer)",
                      s,
                  )
                  s = re.sub(
                      r"Application\.platform\s*!=\s*RuntimePlatform\.Android",
                      "(Application.platform != RuntimePlatform.Android && "
                      "Application.platform != RuntimePlatform.IPhonePlayer)",
                      s,
                  )

                  # Only widen UNITY_ANDROID blocks that do not use AndroidJava;
                  # Android Java APIs themselves cannot exist on iOS.
                  if "AndroidJava" not in original:
                      s = re.sub(
                          r"(?m)^(\s*)#if\s+UNITY_ANDROID\s*$",
                          r"\1#if UNITY_ANDROID || UNITY_IOS",
                          s,
                      )
                      s = re.sub(
                          r"(?m)^(\s*)#elif\s+UNITY_ANDROID\s*$",
                          r"\1#elif UNITY_ANDROID || UNITY_IOS",
                          s,
                      )

              if s != original:
                  path.write_text(s, encoding="utf-8")
                  changed.append(str(path))

          report.write_text("\n".join(changed) + ("\n" if changed else ""))
          print("Patched input files:", len(changed))
          for p in changed[:120]:
              print(p)
          PY

          cat > "$PROJECT/Assets/Scripts/Assembly-CSharp/IOSInputBridge.cs" <<'CS'
          using System;
          using UnityEngine;
          using UnityEngine.EventSystems;
          using UnityEngine.SceneManagement;
          using UnityEngine.UI;

          public static class IOSInputBridge
          {
              internal static bool ADown, AHeld, AUp;
              internal static bool BDown, BHeld, BUp;
              internal static bool XDown, XHeld, XUp;
              internal static bool YDown, YHeld, YUp;
              internal static bool StartDown, StartHeld, StartUp;
              internal static Vector2 LeftStick;
              internal static Vector2 RightStick;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              private static void Boot()
              {
                  Input.simulateMouseWithTouches = true;

                  if (UnityEngine.Object.FindObjectOfType<IOSInputBridgeDriver>() == null)
                  {
                      GameObject go = new GameObject("IOSInputBridge");
                      UnityEngine.Object.DontDestroyOnLoad(go);
                      go.AddComponent<IOSInputBridgeDriver>();
                  }
              }

              private static string Norm(string name)
              {
                  if (String.IsNullOrEmpty(name)) return "";
                  return name.ToLowerInvariant()
                      .Replace(" ", "")
                      .Replace("_", "")
                      .Replace("-", "");
              }

              private static bool IsA(string n)
              {
                  return n == "a" || n == "jump" || n == "accept" ||
                         n == "submit" || n == "fire1" || n == "button0" ||
                         n == "cross" || n == "joystickbutton0";
              }

              private static bool IsB(string n)
              {
                  return n == "b" || n == "cancel" || n == "back" ||
                         n == "fire2" || n == "button1" || n == "circle" ||
                         n == "joystickbutton1";
              }

              private static bool IsX(string n)
              {
                  return n == "x" || n == "attack" || n == "action" ||
                         n == "fire3" || n == "button2" ||
                         n == "joystickbutton2";
              }

              private static bool IsY(string n)
              {
                  return n == "y" || n == "special" || n == "secondary" ||
                         n == "button3" || n == "joystickbutton3";
              }

              private static bool IsStart(string n)
              {
                  return n == "start" || n == "pause" || n == "menu" ||
                         n == "startbutton" || n == "joystickbutton7";
              }

              public static bool AnyKeyDown
              {
                  get { return Input.anyKeyDown || ADown || BDown || XDown || YDown || StartDown; }
              }

              public static bool GetButtonDown(string name)
              {
                  bool native = false;
                  try { native = Input.GetButtonDown(name); } catch {}
                  if (native) return true;

                  string n = Norm(name);
                  if (IsA(n)) return ADown;
                  if (IsB(n)) return BDown;
                  if (IsX(n)) return XDown;
                  if (IsY(n)) return YDown;
                  if (IsStart(n)) return StartDown;
                  return false;
              }

              public static bool GetButton(string name)
              {
                  bool native = false;
                  try { native = Input.GetButton(name); } catch {}
                  if (native) return true;

                  string n = Norm(name);
                  if (IsA(n)) return AHeld;
                  if (IsB(n)) return BHeld;
                  if (IsX(n)) return XHeld;
                  if (IsY(n)) return YHeld;
                  if (IsStart(n)) return StartHeld;
                  return false;
              }

              public static bool GetButtonUp(string name)
              {
                  bool native = false;
                  try { native = Input.GetButtonUp(name); } catch {}
                  if (native) return true;

                  string n = Norm(name);
                  if (IsA(n)) return AUp;
                  if (IsB(n)) return BUp;
                  if (IsX(n)) return XUp;
                  if (IsY(n)) return YUp;
                  if (IsStart(n)) return StartUp;
                  return false;
              }

              public static bool GetKeyDown(KeyCode key)
              {
                  if (Input.GetKeyDown(key)) return true;
                  if (key == KeyCode.Space || key == KeyCode.JoystickButton0) return ADown;
                  if (key == KeyCode.Escape || key == KeyCode.JoystickButton1) return BDown;
                  if (key == KeyCode.JoystickButton2) return XDown;
                  if (key == KeyCode.JoystickButton3) return YDown;
                  if (key == KeyCode.Return || key == KeyCode.KeypadEnter || key == KeyCode.JoystickButton7) return StartDown;
                  return false;
              }

              public static bool GetKey(KeyCode key)
              {
                  if (Input.GetKey(key)) return true;
                  if (key == KeyCode.Space || key == KeyCode.JoystickButton0) return AHeld;
                  if (key == KeyCode.Escape || key == KeyCode.JoystickButton1) return BHeld;
                  if (key == KeyCode.JoystickButton2) return XHeld;
                  if (key == KeyCode.JoystickButton3) return YHeld;
                  if (key == KeyCode.Return || key == KeyCode.KeypadEnter || key == KeyCode.JoystickButton7) return StartHeld;
                  return false;
              }

              public static bool GetKeyUp(KeyCode key)
              {
                  if (Input.GetKeyUp(key)) return true;
                  if (key == KeyCode.Space || key == KeyCode.JoystickButton0) return AUp;
                  if (key == KeyCode.Escape || key == KeyCode.JoystickButton1) return BUp;
                  if (key == KeyCode.JoystickButton2) return XUp;
                  if (key == KeyCode.JoystickButton3) return YUp;
                  if (key == KeyCode.Return || key == KeyCode.KeypadEnter || key == KeyCode.JoystickButton7) return StartUp;
                  return false;
              }

              public static float GetAxis(string name)
              {
                  float native = 0f;
                  try { native = Input.GetAxis(name); } catch {}
                  if (Mathf.Abs(native) > 0.01f) return native;

                  string n = Norm(name);
                  if (n == "horizontal" || n == "leftstickx" || n == "movehorizontal")
                      return LeftStick.x;
                  if (n == "vertical" || n == "leftsticky" || n == "movevertical")
                      return LeftStick.y;

                  return native;
              }

              public static float GetAxisRaw(string name)
              {
                  float native = 0f;
                  try { native = Input.GetAxisRaw(name); } catch {}
                  if (Mathf.Abs(native) > 0.01f) return native;

                  string n = Norm(name);
                  if (n == "horizontal" || n == "leftstickx" || n == "movehorizontal")
                      return LeftStick.x;
                  if (n == "vertical" || n == "leftsticky" || n == "movevertical")
                      return LeftStick.y;

                  return native;
              }
          }

          [DefaultExecutionOrder(-10000)]
          public sealed class IOSInputBridgeDriver : MonoBehaviour
          {
              private int stickFinger = -1;
              private Vector2 stickOrigin;
              private float nextVisualFix;
              private float suppressStartUntil;
              private bool titleStartArmed = true;
              private GUIStyle touchLabelStyle;

              private void Awake()
              {
                  DontDestroyOnLoad(gameObject);
                  Input.simulateMouseWithTouches = true;
                  EnsureEventSystem();
                  FixBrokenTitleTextures();
                  SceneManager.sceneLoaded += OnSceneLoaded;
              }

              private void OnDestroy()
              {
                  SceneManager.sceneLoaded -= OnSceneLoaded;
              }

              private void OnSceneLoaded(Scene scene, LoadSceneMode mode)
              {
                  IOSInputBridge.ADown = IOSInputBridge.AHeld = IOSInputBridge.AUp = false;
                  IOSInputBridge.BDown = IOSInputBridge.BHeld = IOSInputBridge.BUp = false;
                  IOSInputBridge.XDown = IOSInputBridge.XHeld = IOSInputBridge.XUp = false;
                  IOSInputBridge.YDown = IOSInputBridge.YHeld = IOSInputBridge.YUp = false;
                  IOSInputBridge.StartDown = IOSInputBridge.StartHeld = IOSInputBridge.StartUp = false;
                  IOSInputBridge.LeftStick = Vector2.zero;
                  IOSInputBridge.RightStick = Vector2.zero;
                  stickFinger = -1;
                  suppressStartUntil = Time.unscaledTime + 0.65f;

                  EnsureEventSystem();
                  FixBrokenTitleTextures();
              }

              private void Update()
              {
                  IOSInputBridge.ADown = false;
                  IOSInputBridge.AUp = false;
                  IOSInputBridge.BDown = false;
                  IOSInputBridge.BUp = false;
                  IOSInputBridge.XDown = false;
                  IOSInputBridge.XUp = false;
                  IOSInputBridge.YDown = false;
                  IOSInputBridge.YUp = false;
                  IOSInputBridge.StartDown = false;
                  IOSInputBridge.StartUp = false;

                  bool aHeld = false;
                  bool bHeld = false;
                  bool xHeld = false;
                  bool yHeld = false;
                  bool startHeld = false;
                  Vector2 stick = Vector2.zero;

                  float w = Mathf.Max(1f, Screen.width);
                  float h = Mathf.Max(1f, Screen.height);
                  float unit = Mathf.Min(w, h);

                  for (int i = 0; i < Input.touchCount; i++)
                  {
                      Touch t = Input.GetTouch(i);
                      Vector2 p = t.position;

                      Vector2 aCenter = new Vector2(w * 0.73f, h * 0.18f);
                      Vector2 bCenter = new Vector2(w * 0.79f, h * 0.36f);
                      Vector2 xCenter = new Vector2(w * 0.66f, h * 0.29f);
                      Vector2 yCenter = new Vector2(w * 0.72f, h * 0.47f);
                      Vector2 startCenter = new Vector2(w * 0.92f, h * 0.90f);

                      bool inA = Vector2.Distance(p, aCenter) < unit * 0.13f;
                      bool inB = Vector2.Distance(p, bCenter) < unit * 0.13f;
                      bool inX = Vector2.Distance(p, xCenter) < unit * 0.12f;
                      bool inY = Vector2.Distance(p, yCenter) < unit * 0.12f;
                      bool inPauseButton = Vector2.Distance(p, startCenter) < unit * 0.10f;

                      bool inTitleStart =
                          titleStartArmed &&
                          p.x > w * 0.36f && p.x < w * 0.64f &&
                          p.y > h * 0.34f && p.y < h * 0.66f;
                      bool inStart = inPauseButton || inTitleStart;

                      if (inA)
                      {
                          aHeld = t.phase != TouchPhase.Ended && t.phase != TouchPhase.Canceled;
                          if (t.phase == TouchPhase.Began) IOSInputBridge.ADown = true;
                          if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              IOSInputBridge.AUp = true;
                      }
                      else if (inB)
                      {
                          bHeld = t.phase != TouchPhase.Ended && t.phase != TouchPhase.Canceled;
                          if (t.phase == TouchPhase.Began) IOSInputBridge.BDown = true;
                          if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              IOSInputBridge.BUp = true;
                      }
                      else if (inX)
                      {
                          xHeld = t.phase != TouchPhase.Ended && t.phase != TouchPhase.Canceled;
                          if (t.phase == TouchPhase.Began) IOSInputBridge.XDown = true;
                          if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              IOSInputBridge.XUp = true;
                      }
                      else if (inY)
                      {
                          yHeld = t.phase != TouchPhase.Ended && t.phase != TouchPhase.Canceled;
                          if (t.phase == TouchPhase.Began) IOSInputBridge.YDown = true;
                          if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              IOSInputBridge.YUp = true;
                      }
                      else if (inStart)
                      {
                          startHeld = false;
                          if (Time.unscaledTime >= suppressStartUntil &&
                              t.phase == TouchPhase.Began)
                          {
                              IOSInputBridge.StartDown = true;
                              if (inTitleStart)
                                  titleStartArmed = false;
                              suppressStartUntil = Time.unscaledTime + 0.40f;
                          }
                          if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              IOSInputBridge.StartUp = true;
                      }

                      // Left half / lower half = virtual movement stick.
                      if (p.x < w * 0.46f && p.y < h * 0.58f)
                      {
                          if (stickFinger == -1 && t.phase == TouchPhase.Began)
                          {
                              stickFinger = t.fingerId;
                              stickOrigin = p;
                          }

                          if (t.fingerId == stickFinger)
                          {
                              if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                              {
                                  stickFinger = -1;
                              }
                              else
                              {
                                  float radius = unit * 0.16f;
                                  stick = Vector2.ClampMagnitude((p - stickOrigin) / radius, 1f);
                              }
                          }
                      }
                  }

                  IOSInputBridge.AHeld = aHeld;
                  IOSInputBridge.BHeld = bHeld;
                  IOSInputBridge.XHeld = xHeld;
                  IOSInputBridge.YHeld = yHeld;
                  IOSInputBridge.StartHeld = startHeld;
                  IOSInputBridge.LeftStick = stick;

                  if (Time.unscaledTime >= nextVisualFix)
                  {
                      nextVisualFix = Time.unscaledTime + 2f;
                      EnsureEventSystem();
                      FixBrokenTitleTextures();
                  }
              }

              // v24: do not draw our temporary X/Y/II overlay.
              // Let the recovered game's own mobile UI be visible.
              private void OnGUI()
              {
              }

              private static void EnsureEventSystem()
              {
                  EventSystem es = FindObjectOfType<EventSystem>();

                  if (es == null)
                  {
                      GameObject go = new GameObject("EventSystem_iOS");
                      es = go.AddComponent<EventSystem>();
                      go.AddComponent<StandaloneInputModule>();
                  }
                  else
                  {
                      es.enabled = true;
                      BaseInputModule[] modules = es.GetComponents<BaseInputModule>();

                      if (modules == null || modules.Length == 0)
                          es.gameObject.AddComponent<StandaloneInputModule>();
                      else
                          for (int i = 0; i < modules.Length; i++)
                              modules[i].enabled = true;
                  }
              }

              private static bool LooksLikeTitleUI(string name)
              {
                  if (String.IsNullOrEmpty(name)) return false;
                  string n = name.ToLowerInvariant();

                  return n.Contains("sonic") || n.Contains("title") ||
                         n.Contains("logo") || n.Contains("menu") ||
                         n.Contains("loading") || n.Contains("splash") ||
                         n.Contains("background") || n.Contains("sega");
              }

              private static void FixBrokenTitleTextures()
              {
                  RawImage[] raws = Resources.FindObjectsOfTypeAll<RawImage>();

                  for (int i = 0; i < raws.Length; i++)
                  {
                      RawImage r = raws[i];
                      if (r == null || !LooksLikeTitleUI(r.name)) continue;

                      if (r.texture != null)
                          r.texture.wrapMode = TextureWrapMode.Clamp;

                      r.uvRect = new Rect(0f, 0f, 1f, 1f);
                  }

                  Image[] images = Resources.FindObjectsOfTypeAll<Image>();

                  for (int i = 0; i < images.Length; i++)
                  {
                      Image img = images[i];
                      if (img == null || !LooksLikeTitleUI(img.name)) continue;

                      if (img.sprite != null && img.sprite.texture != null)
                          img.sprite.texture.wrapMode = TextureWrapMode.Clamp;
                  }

                  Renderer[] renderers = Resources.FindObjectsOfTypeAll<Renderer>();

                  for (int i = 0; i < renderers.Length; i++)
                  {
                      Renderer r = renderers[i];
                      if (r == null || !LooksLikeTitleUI(r.name)) continue;

                      Material[] mats = r.sharedMaterials;
                      if (mats == null) continue;

                      for (int m = 0; m < mats.Length; m++)
                      {
                          Material mat = mats[m];
                          if (mat == null || mat.mainTexture == null) continue;

                          mat.mainTexture.wrapMode = TextureWrapMode.Clamp;
                          mat.mainTextureScale = Vector2.one;
                          mat.mainTextureOffset = Vector2.zero;
                      }
                  }
              }
          }
          CS

          echo "===== V24 XINPUTDOTNETPURE IOS SHIM ====="

          XINPUT_MANAGED=$(find "$PROJECT/Assets" -type f -iname "XInputDotNetPure.dll" -print -quit || true)
          XINPUT_SOURCE_REFS=$(wc -l < output/v24-xinput-source-files.txt 2>/dev/null || echo 0)

          # XInputInterface.dll is the Windows native bridge. It can never run on
          # iPhone; our C# shim replaces calls before runtime.
          find "$PROJECT/Assets" -type f \
            \( -iname "XInputInterface.dll" -o -iname "XInputInterface.dll.meta" \) \
            -print | tee output/v24-removed-windows-xinput-interface.txt || true
          find "$PROJECT/Assets" -type f \
            \( -iname "XInputInterface.dll" -o -iname "XInputInterface.dll.meta" \) \
            -delete || true

          if [ -n "$XINPUT_MANAGED" ] && [ "$XINPUT_SOURCE_REFS" -gt 0 ]; then
            echo "Detected XInputDotNetPure: $XINPUT_MANAGED"
            echo "Creating iOS GamePad.GetState replacement."

            cat > "$PROJECT/Assets/Scripts/Assembly-CSharp/IOSXInputGamePad.cs" <<'CS'
          using System;
          using System.Reflection;
          using UnityEngine;
          using XInputDotNetPure;

          // Keeps the original XInputDotNetPure GamePadState/Buttons API used
          // by recovered Sonic scripts, but fills it from our touch controls
          // instead of calling the Windows-only XInputInterface.dll.
          public static class IOSXInputGamePad
          {
              private static readonly BindingFlags BF =
                  BindingFlags.Instance | BindingFlags.NonPublic | BindingFlags.Public;

              private static object Make(Type t)
              {
                  return Activator.CreateInstance(t);
              }

              private static void Set(object boxed, string field, object value)
              {
                  FieldInfo f = boxed.GetType().GetField(field, BF);
                  if (f != null) f.SetValue(boxed, value);
              }

              private static ButtonState BS(bool value)
              {
                  return value ? ButtonState.Pressed : ButtonState.Released;
              }

              public static GamePadState GetState(PlayerIndex playerIndex)
              {
                  return BuildState();
              }

              public static GamePadState GetState(PlayerIndex playerIndex, GamePadDeadZone deadZone)
              {
                  return BuildState();
              }

              public static void SetVibration(PlayerIndex playerIndex, float leftMotor, float rightMotor)
              {
                  // No-op on iPhone.
              }

              private static GamePadState BuildState()
              {
                  // BUTTONS
                  object buttons = Make(typeof(GamePadButtons));
                  Set(buttons, "start", BS(IOSInputBridge.StartHeld || IOSInputBridge.StartDown));
                  Set(buttons, "back", BS(IOSInputBridge.BHeld || IOSInputBridge.BDown));
                  Set(buttons, "leftStick", ButtonState.Released);
                  Set(buttons, "rightStick", ButtonState.Released);
                  Set(buttons, "leftShoulder", ButtonState.Released);
                  Set(buttons, "rightShoulder", ButtonState.Released);
                  Set(buttons, "guide", ButtonState.Released);
                  Set(buttons, "a", BS(IOSInputBridge.AHeld || IOSInputBridge.ADown));
                  Set(buttons, "b", BS(IOSInputBridge.BHeld || IOSInputBridge.BDown));
                  Set(buttons, "x", BS(IOSInputBridge.XHeld || IOSInputBridge.XDown));
                  Set(buttons, "y", BS(IOSInputBridge.YHeld || IOSInputBridge.YDown));

                  // D-PAD mirrors the left touch stick. This is important for
                  // menus that read DPad instead of ThumbSticks.
                  Vector2 ls = IOSInputBridge.LeftStick;
                  object dpad = Make(typeof(GamePadDPad));
                  Set(dpad, "up", BS(ls.y > 0.40f));
                  Set(dpad, "down", BS(ls.y < -0.40f));
                  Set(dpad, "left", BS(ls.x < -0.40f));
                  Set(dpad, "right", BS(ls.x > 0.40f));

                  // STICKS
                  Type stickType = typeof(GamePadThumbSticks).GetNestedType("StickValue", BF);
                  object leftStick = Make(stickType);
                  object rightStick = Make(stickType);
                  Set(leftStick, "x", Mathf.Clamp(ls.x, -1f, 1f));
                  Set(leftStick, "y", Mathf.Clamp(ls.y, -1f, 1f));

                  Vector2 rs = IOSInputBridge.RightStick;
                  Set(rightStick, "x", Mathf.Clamp(rs.x, -1f, 1f));
                  Set(rightStick, "y", Mathf.Clamp(rs.y, -1f, 1f));

                  object sticks = Make(typeof(GamePadThumbSticks));
                  Set(sticks, "left", leftStick);
                  Set(sticks, "right", rightStick);

                  // TRIGGERS
                  object triggers = Make(typeof(GamePadTriggers));
                  Set(triggers, "left", 0f);
                  Set(triggers, "right", 0f);

                  // GAMEPAD STATE
                  object state = Make(typeof(GamePadState));
                  Set(state, "isConnected", true);
                  Set(state, "packetNumber", (uint)Time.frameCount);
                  Set(state, "buttons", buttons);
                  Set(state, "dPad", dpad);
                  Set(state, "thumbSticks", sticks);
                  Set(state, "triggers", triggers);

                  return (GamePadState)state;
              }
          }
          CS
          else
            echo "XInputDotNetPure managed DLL/source combo not detected."
            echo "v23-controller-backends.txt will show which backend Sonic uses."
          fi

          echo "===== V24 HIDE BASIC CONTROLS OVERLAY ====="

          cat > "$PROJECT/Assets/Scripts/Assembly-CSharp/IOSNativeMobileUICleaner.cs" <<'CS'
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.UI;

          public sealed class IOSNativeMobileUICleaner : MonoBehaviour
          {
              private static IOSNativeMobileUICleaner instance;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              private static void Boot()
              {
                  if (instance != null) return;

                  GameObject go = new GameObject("IOSNativeMobileUICleaner_v24");
                  DontDestroyOnLoad(go);
                  instance = go.AddComponent<IOSNativeMobileUICleaner>();
              }

              private void Awake()
              {
                  SceneManager.sceneLoaded += OnSceneLoaded;
                  StartCoroutine(CleanSeveralFrames());
              }

              private void OnDestroy()
              {
                  SceneManager.sceneLoaded -= OnSceneLoaded;
              }

              private void OnSceneLoaded(Scene scene, LoadSceneMode mode)
              {
                  StartCoroutine(CleanSeveralFrames());
              }

              private IEnumerator CleanSeveralFrames()
              {
                  for (int i = 0; i < 12; i++)
                  {
                      yield return null;
                      HideBasicControlsHelp();
                  }

                  yield return new WaitForSecondsRealtime(0.25f);
                  HideBasicControlsHelp();
                  yield return new WaitForSecondsRealtime(0.75f);
                  HideBasicControlsHelp();
              }

              private static string Norm(string s)
              {
                  return string.IsNullOrEmpty(s)
                      ? ""
                      : s.Replace("_", " ").Replace("-", " ").Trim().ToLowerInvariant();
              }

              private static bool LooksLikeBasicControlsLabel(string s)
              {
                  string n = Norm(s);
                  return n.Contains("basic controls") ||
                         n.Contains("basic control") ||
                         n.Contains("controller help") ||
                         n.Contains("control guide") ||
                         n.Contains("controls guide");
              }

              private static bool LooksLikeHelpPanelName(string s)
              {
                  string n = Norm(s);

                  if (n.Contains("basic controls") || n.Contains("basic control"))
                      return true;

                  bool controls =
                      n.Contains("control") || n.Contains("controller");
                  bool help =
                      n.Contains("help") || n.Contains("guide") ||
                      n.Contains("tutorial") || n.Contains("manual");

                  return controls && help;
              }

              private static void StopBlocking(GameObject go)
              {
                  if (go == null) return;

                  CanvasGroup cg = go.GetComponent<CanvasGroup>();
                  if (cg == null)
                      cg = go.AddComponent<CanvasGroup>();

                  cg.alpha = 0f;
                  cg.interactable = false;
                  cg.blocksRaycasts = false;
              }

              private static GameObject PickPanelRoot(Transform t)
              {
                  if (t == null) return null;

                  Transform candidate = t;

                  for (int depth = 0; depth < 5 && candidate != null; depth++)
                  {
                      if (LooksLikeHelpPanelName(candidate.name))
                          return candidate.gameObject;

                      Transform parent = candidate.parent;
                      if (parent == null || parent.GetComponent<Canvas>() != null)
                          break;

                      candidate = parent;
                  }

                  candidate = t;
                  for (int depth = 0; depth < 2; depth++)
                  {
                      if (candidate.parent == null ||
                          candidate.parent.GetComponent<Canvas>() != null)
                          break;
                      candidate = candidate.parent;
                  }

                  return candidate.gameObject;
              }

              private static void HideBasicControlsHelp()
              {
                  HashSet<GameObject> hide = new HashSet<GameObject>();

                  GameObject[] all = Resources.FindObjectsOfTypeAll<GameObject>();
                  foreach (GameObject go in all)
                  {
                      if (go == null || !go.scene.IsValid())
                          continue;

                      if (LooksLikeHelpPanelName(go.name))
                          hide.Add(go);
                  }

                  Text[] labels = Resources.FindObjectsOfTypeAll<Text>();
                  foreach (Text label in labels)
                  {
                      if (label == null || label.gameObject == null ||
                          !label.gameObject.scene.IsValid())
                          continue;

                      if (LooksLikeBasicControlsLabel(label.text))
                      {
                          GameObject root = PickPanelRoot(label.transform);
                          if (root != null)
                              hide.Add(root);
                      }
                  }

                  foreach (GameObject go in hide)
                  {
                      if (go == null) continue;

                      if (go.GetComponent<Canvas>() != null)
                      {
                          StopBlocking(go);
                          continue;
                      }

                      StopBlocking(go);
                      go.SetActive(false);
                      Debug.Log("[v24] Hidden Basic Controls/help overlay: " + go.name);
                  }
              }
          }
          CS

          echo "Created IOSNativeMobileUICleaner.cs"

          echo "===== V24 INPUT PATCH REPORT ====="
          wc -l output/v24-input-patched-files.txt || true
          head -120 output/v24-input-patched-files.txt || true

          echo "===== V24 FIX: CLAMP MENU / LOGO / LOADING TEXTURES ====="
          : > output/v24-clamped-ui-textures.txt

          # The current iOS build shows the SONIC title texture tiled across
          # the whole screen. AssetRipper can restore some UI textures with
          # Repeat wrapping. Clamp likely UI/title textures before Unity import.
          while IFS= read -r IMG; do
            META="$IMG.meta"
            [ -f "$META" ] || continue

            case "$(echo "$IMG" | tr '[:upper:]' '[:lower:]')" in
              *logo*|*title*|*loading*|*control*|*menu*|*splash*|*background*|*/bg_*|*_bg.*|*sega*)
                if grep -qE '^[[:space:]]*wrapMode:[[:space:]]*0([[:space:]]|$)' "$META"; then
                  sed -Ei 's/^([[:space:]]*wrapMode:)[[:space:]]*0([[:space:]]*)$/\1 1\2/' "$META"
                  echo "$IMG" >> output/v24-clamped-ui-textures.txt
                fi

                # Some Unity 2018 metas use per-axis wrap fields.
                sed -Ei \
                  's/^([[:space:]]*wrapU:)[[:space:]]*0([[:space:]]*)$/\1 1\2/;
                   s/^([[:space:]]*wrapV:)[[:space:]]*0([[:space:]]*)$/\1 1\2/;
                   s/^([[:space:]]*wrapW:)[[:space:]]*0([[:space:]]*)$/\1 1\2/' \
                  "$META" || true
                ;;
            esac
          done < <(
            find "$PROJECT/Assets" -type f \
              \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \
                 -o -iname "*.tga" -o -iname "*.psd" \) \
              | sort
          )

          echo "Clamped UI textures:"
          cat output/v24-clamped-ui-textures.txt || true

      - name: Create recovery report
        run: |
          set -e

          PROJECT=$(cat output/recovered-project-path.txt)

          {
            echo "SONIC P-06 SONIC RELEASE iOS - RECOVERY REPORT"
            echo "====================================="
            echo
            echo "Original APK: $(cat output/apk-path.txt | sed 's/^APK=//')"
            echo "Unity: $(cat output/unity-version.txt | sed 's/^UNITY_VERSION=//')"
            echo "Mono Assembly-CSharp.dll: YES"
            echo "Recovered Assets/: YES"
            echo "Recovered ProjectSettings/: YES"
            echo "Android native plugins removed from recovered project: YES"
            echo
            echo "Recovered C# files: $(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"
            echo "Recovered scenes: $(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
            echo
            echo "Target: Sonic Release -> Unity 2018.2.0f2 iOS / arm64."
          } > output/RECOVERY-REPORT.txt

          cat output/RECOVERY-REPORT.txt

      - name: Upload recovered Sonic project
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-Recovered-Unity-Project
          path: |
            recovered/SonicP06Release
            output/RECOVERY-REPORT.txt
            output/assetripper.log
            output/loadfolder-response.txt
            output/export-response.txt
            output/assetripper-assets.txt
            output/recovered-project-path.txt
            output/mobile-input-markers.txt
            output/scenes.txt
            output/android-csharp-references.txt
            output/touch-csharp-references.txt
            output/removed-android-plugins.txt
            output/removed-duplicate-spatialtracking.txt
            output/v24-clamped-ui-textures.txt
            output/v24-input-patched-files.txt
          compression-level: 0

  build_unity_ios:
    name: Setup + Activate + Build Unity iOS
    needs: recover
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}

    outputs:
      unity_result: ${{ steps.final_unity.outputs.result }}
      xcode_ready: ${{ steps.detect_xcode.outputs.ready }}

    steps:
      - name: Check Unity login secrets
        run: |
          set -e

          if [ -z "$UNITY_USERNAME" ]; then
            echo "ERROR: UNITY_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$UNITY_PASSWORD" ]; then
            echo "ERROR: UNITY_PASSWORD secret is missing"
            exit 1
          fi

          echo "UNITY LOGIN SECRETS: OK"

      - name: Download recovered project
        uses: actions/download-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-Recovered-Unity-Project
          path: recovered-artifact

      - name: Locate Unity project
        id: locate
        run: |
          set -e

          PROJECT=$(
            find recovered-artifact \
              -type f \
              -path "*/ProjectSettings/ProjectVersion.txt" \
              -print \
              | head -1 \
              | xargs dirname \
              | xargs dirname
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: recovered Unity project not found."
            exit 1
          fi

          VERSION_FILE="$PROJECT/ProjectSettings/ProjectVersion.txt"

          test -f "$VERSION_FILE"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version_file=$VERSION_FILE" >> "$GITHUB_OUTPUT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "===== PROJECT VERSION ====="
          cat "$VERSION_FILE"

      - name: Verify fixed Unity version metadata
        run: |
          set -e
          echo "===== V5 DIRECT HUB FIX ACTIVE ====="
          echo "Expected editor: 2018.2.0f2 (787658998520)"
          echo "Recovered ProjectVersion.txt:"
          cat "${{ steps.locate.outputs.version_file }}"

      - name: V13 stabilize old Unity project for Linux CI
        run: |
          set -e

          PROJECT="${{ steps.locate.outputs.project }}"
          echo "===== SONIC RELEASE v1 ====="

          # Start the first attempt from a clean import. The second attempt below
          # intentionally keeps the freshly generated Library cache, because v11
          # died late during import/shader work with exit 134.
          sudo rm -rf "$PROJECT/Library" "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" 2>/dev/null || true

          # Attempt 1 preserves the game assets/settings; attempt 2 only resets GraphicsSettings.
          # The original GraphicsSettings is backed up before the fallback retry.
          cat > "$PROJECT/SONIC-RELEASE-v1-CI-PATCH.txt" <<'EOF'
          Sonic P-06 Sonic Release iOS v1
          - use the NEWEST GitHub Release APK, selecting the largest APK asset
          - reuse our proven AssetRipper -> Unity -> Xcode -> unsigned IPA pipeline
          - keep old Unity 2018.2 compiler/Xcode fixes
          - keep XInput/touch compatibility code where applicable
          - keep icon and old-Unity shell-script permission fixes
          - first run stops early if this APK uses a different Unity version/backend
          EOF

      - name: Setup Node 22 for Unity CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity CLI + Unity Hub
        run: |
          set -e

          echo "===== V7 HUB SYMLINK FIX ACTIVE ====="

          npm install -g @rage-against-the-pixel/unity-cli

          echo "===== UNITY CLI ====="
          unity-cli --help >/dev/null
          echo "unity-cli: OK"

          echo "===== INSTALL UNITY HUB DIRECTLY ====="

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg \
            xvfb \
            libgbm1 \
            libgtk-3-0 \
            libnss3

          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor \
              -o /etc/apt/keyrings/unityhub.gpg

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/unityhub.list \
              >/dev/null

          sudo apt-get update
          sudo apt-get install -y unityhub

          echo "===== HUB PACKAGE FILES ====="
          dpkg -L unityhub \
            | grep -E '/opt/unityhub|/usr/bin/unityhub' \
            | head -120 || true

          echo "===== DETECT INSTALLED HUB ====="

          HUB_CMD="$(command -v unityhub || true)"

          if [ -z "$HUB_CMD" ]; then
            echo "ERROR: unityhub command not found after apt install"
            dpkg -L unityhub || true
            exit 1
          fi

          echo "HUB_CMD=$HUB_CMD"
          ls -l "$HUB_CMD" || true
          file "$HUB_CMD" || true
          readlink -f "$HUB_CMD" || true

          echo "===== CREATE COMPATIBILITY HUB PATH ====="

          # Current Ubuntu Unity Hub package on this runner installs
          # /usr/bin/unityhub instead of /opt/unityhub/unityhub.
          # unity-cli still expects /opt/unityhub/unityhub on Linux.
          sudo mkdir -p /opt/unityhub

          sudo tee /opt/unityhub/unityhub >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$HUB_CMD" --no-sandbox --headless "\$@"
          EOF

          sudo chmod +x /opt/unityhub/unityhub

          test -x /opt/unityhub/unityhub
          test -e "$HUB_CMD"

          echo "UNITY_HUB_PATH=/opt/unityhub/unityhub" \
            >> "$GITHUB_ENV"

          echo "/opt/unityhub" >> "$GITHUB_PATH"

          echo "===== V8 HUB READY ====="
          ls -lh /opt/unityhub/unityhub "$HUB_CMD" || true

          echo "===== UNITY-CLI HUB CHECK ====="
          UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli hub-path || true

          UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli hub-version || true

      - name: Prepare real Unity Licensing Client
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -e

          echo "===== V10 LICENSING CLIENT FIX ACTIVE ====="

          find_client() {
            find \
              /usr \
              /opt \
              "$HOME" \
              -type f \
              -name "Unity.Licensing.Client" \
              2>/dev/null \
              | head -1
          }

          CLIENT="$(find_client || true)"

          if [ -z "$CLIENT" ]; then
            echo "Unity Licensing Client not found in Hub package."
            echo "Installing Unity 2018.2.0f2 so its Licensing Client is available."

            UNITY_HUB_PATH=/opt/unityhub/unityhub \
            unity-cli setup-unity \
              --unity-project none \
              --unity-version 2018.2.0f2 \
              --changeset 787658998520 \
              --build-targets iOS \
              --modules ios \
              --json

            CLIENT="$(find_client || true)"
          fi

          if [ -z "$CLIENT" ]; then
            echo "ERROR: Unity.Licensing.Client still not found."
            echo "===== POSSIBLE UNITY FILES ====="
            find /usr /opt "$HOME" \
              -type f \
              \( -iname "*Licensing*Client*" -o -iname "Unity*" \) \
              2>/dev/null \
              | head -300 || true
            exit 1
          fi

          echo "FOUND_CLIENT=$CLIENT"

          CLIENT_DIR="$(dirname "$CLIENT")"

          sudo rm -rf /opt/unityhub/UnityLicensingClient
          sudo mkdir -p /opt/unityhub/UnityLicensingClient

          # Copy the whole client directory, not just the executable,
          # because the licensing binary can depend on sibling files.
          sudo cp -a "$CLIENT_DIR"/. /opt/unityhub/UnityLicensingClient/

          sudo chmod +x \
            /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client \
            || true

          test -f /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client

          echo "===== STAGED LICENSING CLIENT ====="
          find /opt/unityhub/UnityLicensingClient \
            -maxdepth 2 \
            -type f \
            -print \
            | head -120

          echo "The unity-cli glob /opt/unityhub/**/Unity.Licensing.Client can now resolve."

      - name: Activate Unity Personal - skip broken precheck
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -e

          echo "===== V10 PERSONAL ACTIVATION ====="
          echo "UNITY_HUB_PATH=$UNITY_HUB_PATH"

          test -x "$UNITY_HUB_PATH"
          test -e /usr/bin/unityhub

          GLOBAL_NODE_MODULES="$(npm root -g)"
          LICENSE_MODULE="$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli/dist/license-client.js"

          if [ ! -f "$LICENSE_MODULE" ]; then
            echo "ERROR: unity-cli licensing module not found:"
            echo "$LICENSE_MODULE"
            find "$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli" \
              -maxdepth 3 \
              -type f \
              -iname "*license-client*" \
              -print || true
            exit 1
          fi

          echo "LICENSE_MODULE=$LICENSE_MODULE"
          export LICENSE_MODULE

          # unity-cli normally checks active entitlements before activation.
          # On a fresh runner that precheck can fail before --activate-ulf runs.
          # The library API exposes skipEntitlementCheck as Activate(..., true).
          node <<'NODE'
          const {
            LicensingClient,
            LicenseType
          } = require(process.env.LICENSE_MODULE);

          async function main() {
            const client = new LicensingClient('6.x');

            await client.Activate(
              {
                licenseType: LicenseType.personal,
                username: process.env.UNITY_USERNAME,
                password: process.env.UNITY_PASSWORD
              },
              true
            );

            console.log("UNITY PERSONAL ACTIVATION: SUCCESS");
          }

          main().catch((error) => {
            console.error("UNITY PERSONAL ACTIVATION FAILED:");
            console.error(error && error.message ? error.message : error);
            process.exit(1);
          });
          NODE

          echo "===== LICENSE CONTEXT ====="
          unity-cli license-context || true

      - name: Collect Unity licensing diagnostics
        if: failure()
        run: |
          set +e

          mkdir -p licensing-diagnostics

          LOG_PATH="$(unity-cli licensing-client-logs 2>/dev/null | tail -1 || true)"
          AUDIT_PATH="$(unity-cli licensing-audit-logs 2>/dev/null | tail -1 || true)"

          echo "LOG_PATH=$LOG_PATH"
          echo "AUDIT_PATH=$AUDIT_PATH"

          if [ -n "$LOG_PATH" ] && [ -f "$LOG_PATH" ]; then
            cp "$LOG_PATH" licensing-diagnostics/Unity.Licensing.Client.log
            tail -160 "$LOG_PATH" || true
          fi

          if [ -n "$AUDIT_PATH" ] && [ -f "$AUDIT_PATH" ]; then
            cp "$AUDIT_PATH" licensing-diagnostics/Unity.Entitlements.Audit.log
            tail -160 "$AUDIT_PATH" || true
          fi

      - name: Upload Unity licensing diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-Unity-License-Diagnostics-v10
          path: licensing-diagnostics
          if-no-files-found: ignore
          compression-level: 0

      - name: Export activated Personal license for GameCI
        id: export_license
        run: |
          set -e

          echo "===== FIND ACTIVATED UNITY LICENSE ====="

          LICENSE_FILE=""

          for CANDIDATE in \
            "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf" \
            "$HOME/.config/unity3d/Unity/Unity_lic.ulf" \
            "/root/.local/share/unity3d/Unity/Unity_lic.ulf" \
            "/root/.config/unity3d/Unity/Unity_lic.ulf"
          do
            if [ -s "$CANDIDATE" ]; then
              LICENSE_FILE="$CANDIDATE"
              break
            fi
          done

          if [ -z "$LICENSE_FILE" ]; then
            LICENSE_FILE=$(
              find \
                "$HOME" \
                /root \
                /usr/share/unity3d \
                /var/lib/unity3d \
                -type f \
                \( -name "Unity_lic.ulf" -o -name "*.ulf" \) \
                2>/dev/null \
                | head -1
            )
          fi

          if [ -z "$LICENSE_FILE" ] || [ ! -s "$LICENSE_FILE" ]; then
            echo "ERROR: Unity activation completed but no .ulf license file was found"
            echo "===== LICENSING DIRECTORIES ====="
            find "$HOME/.local/share" "$HOME/.config" \
              -maxdepth 5 \
              -type f \
              2>/dev/null \
              | grep -Ei 'unity|license|ulf' \
              | head -200 || true
            exit 1
          fi

          echo "LICENSE_FILE=$LICENSE_FILE"
          echo "LICENSE_SIZE=$(wc -c < "$LICENSE_FILE" | tr -d ' ') bytes"

          {
            echo "UNITY_LICENSE<<UNITY_LICENSE_EOF"
            cat "$LICENSE_FILE"
            echo
            echo "UNITY_LICENSE_EOF"
          } >> "$GITHUB_ENV"

          echo "Unity Personal license exported for the next build step."

      - name: Unity iOS build attempt 1
        id: unity_build_1
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ steps.locate.outputs.project }}
          targetPlatform: iOS
          unityVersion: 2018.2.0f2
          customImage: unityci/editor:ubuntu-2018.2.0f2-ios-3.2.2
          buildsPath: build
          buildName: Sonic2006-iOS
          allowDirtyBuild: true
          versioning: None
          customParameters: -accept-apiupdate -force-glcore -force-gfx-st

      - name: Inspect attempt 1
        id: detect_xcode_1
        if: always()
        run: |
          set +e

          echo "ATTEMPT1_OUTCOME=${{ steps.unity_build_1.outcome }}"
          echo "ATTEMPT1_ENGINE_EXIT=${{ steps.unity_build_1.outputs.engineExitCode }}"

          PROJECT="${{ steps.locate.outputs.project }}"
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" build 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" build 2>/dev/null || true

          PROJ=$(find build -type d -name "*.xcodeproj" -print 2>/dev/null | head -1)
          if [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 already generated Xcode: $PROJ"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Attempt 1 did not generate Xcode."
          fi

      - name: Prepare graphics-safe retry after Unity abort
        if: steps.detect_xcode_1.outputs.ready != 'true'
        run: |
          set +e

          PROJECT="${{ steps.locate.outputs.project }}"
          echo "===== V24 WARM RETRY ====="
          echo "Attempt 1 used legacy GL Core + single-threaded graphics."
          echo "For attempt 2 we also regenerate GraphicsSettings.asset."

          mkdir -p v17-backup

          if [ -f "$PROJECT/ProjectSettings/GraphicsSettings.asset" ]; then
            cp "$PROJECT/ProjectSettings/GraphicsSettings.asset"               v17-backup/GraphicsSettings.asset.original
            rm -f "$PROJECT/ProjectSettings/GraphicsSettings.asset"
            echo "Original GraphicsSettings.asset backed up."
          else
            echo "GraphicsSettings.asset was already absent."
          fi

          # Temp/obj can contain stale locks after SIGABRT. Keep Library warm.
          sudo rm -rf "$PROJECT/Temp" "$PROJECT/obj" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$PROJECT" 2>/dev/null || true
          chmod -R u+rwX "$PROJECT" 2>/dev/null || true

          echo "Library size before retry:"
          du -sh "$PROJECT/Library" 2>/dev/null || true
          sleep 5

      - name: Unity iOS build attempt 2 - warm Library
        id: unity_build_2
        if: steps.detect_xcode_1.outputs.ready != 'true'
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
        with:
          projectPath: ${{ steps.locate.outputs.project }}
          targetPlatform: iOS
          unityVersion: 2018.2.0f2
          customImage: unityci/editor:ubuntu-2018.2.0f2-ios-3.2.2
          buildsPath: build
          buildName: Sonic2006-iOS
          allowDirtyBuild: true
          versioning: None
          customParameters: -accept-apiupdate -force-glcore -force-gfx-st

      - name: Detect generated iOS Xcode project
        id: detect_xcode
        if: always()
        run: |
          set +e

          echo "===== V24 FINAL XCODE DETECTION ====="
          echo "ATTEMPT1=${{ steps.unity_build_1.outcome }} / engine=${{ steps.unity_build_1.outputs.engineExitCode }}"
          echo "ATTEMPT2=${{ steps.unity_build_2.outcome }} / engine=${{ steps.unity_build_2.outputs.engineExitCode }}"

          sudo chown -R "$(id -u):$(id -g)" build 2>/dev/null || true
          chmod -R u+rwX build 2>/dev/null || true

          PROJ=$(
            find build \
              -type d \
              -name "*.xcodeproj" \
              -print 2>/dev/null \
              | head -1
          )

          if [ -n "$PROJ" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "XCODE_PROJECT_FOUND=$PROJ"
            find "$(dirname "$PROJ")" -maxdepth 2 -type f | head -160 || true
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Xcode project was generated after two attempts."
          fi

      - name: Set final Unity result
        id: final_unity
        if: always()
        run: |
          if [ "${{ steps.detect_xcode.outputs.ready }}" = "true" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "FINAL UNITY RESULT: success"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "FINAL UNITY RESULT: failure"
          fi

      - name: Collect Unity build diagnostics
        if: always() && steps.detect_xcode.outputs.ready != 'true'
        run: |
          set +e

          mkdir -p unity-build-diagnostics

          {
            echo "V24=true"
            echo "ATTEMPT1_OUTCOME=${{ steps.unity_build_1.outcome }}"
            echo "ATTEMPT1_ENGINE_EXIT=${{ steps.unity_build_1.outputs.engineExitCode }}"
            echo "ATTEMPT2_OUTCOME=${{ steps.unity_build_2.outcome }}"
            echo "ATTEMPT2_ENGINE_EXIT=${{ steps.unity_build_2.outputs.engineExitCode }}"
            echo "XCODE_READY=${{ steps.detect_xcode.outputs.ready }}"
            echo "PROJECT=${{ steps.locate.outputs.project }}"
          } > unity-build-diagnostics/summary.txt

          echo "===== FIND UNITY / CRASH LOGS ====="

          PROJECT="${{ steps.locate.outputs.project }}"

          for BASE in \
            "$HOME/.local/share/unity3d" \
            "$HOME/.config/unity3d" \
            "$PROJECT" \
            build \
            "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" \
            /tmp
          do
            [ -e "$BASE" ] || continue

            sudo find "$BASE" \
              -type f \
              \( -iname "*.log" \
                 -o -iname "Editor.log" \
                 -o -iname "*.txt" \
                 -o -iname "core" \
                 -o -iname "core.*" \
                 -o -iname "*.dmp" \) \
              -size -20M \
              -print 2>/dev/null \
              | head -240
          done > unity-build-diagnostics/log-files.txt || true

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue

            SAFE_NAME=$(
              echo "$FILE" \
                | sed 's#^/##; s#[/ ]#_#g'
            )

            sudo cp "$FILE" \
              "unity-build-diagnostics/$SAFE_NAME" \
              2>/dev/null || true
          done < unity-build-diagnostics/log-files.txt

          if [ -d "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" ]; then
            mkdir -p unity-build-diagnostics/GameCI-UnityDiagnostics
            cp -a "$GITHUB_WORKSPACE/Logs/UnityDiagnostics"/.               unity-build-diagnostics/GameCI-UnityDiagnostics/ 2>/dev/null || true
          fi

          if [ -d "$GITHUB_WORKSPACE/Logs/UnityDiagnostics" ]; then
            mkdir -p unity-build-diagnostics/GameCI-UnityDiagnostics
            cp -a "$GITHUB_WORKSPACE/Logs/UnityDiagnostics"/. \
              unity-build-diagnostics/GameCI-UnityDiagnostics/ 2>/dev/null || true
          fi

          if [ -d v17-backup ]; then
            mkdir -p unity-build-diagnostics/v17-backup
            cp -a v17-backup/. unity-build-diagnostics/v17-backup/ 2>/dev/null || true
          fi

          sudo chown -R "$(id -u):$(id -g)" unity-build-diagnostics || true
          chmod -R u+rwX unity-build-diagnostics || true

          grep -RniE \
            'SIGABRT|Aborted|Caught fatal signal|Assertion failed|AudioManager|FMOD|error CS[0-9]+|Compilation failed|compiler error|Exception|error:|failed|FAILURE|did the Editor crash' \
            unity-build-diagnostics \
            > unity-build-diagnostics/important-errors.txt \
            2>/dev/null || true

          echo "===== IMPORTANT UNITY ERRORS ====="
          tail -320 unity-build-diagnostics/important-errors.txt || true

      - name: Upload Unity iOS Xcode result
        if: steps.detect_xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-iOS-Xcode
          path: build
          compression-level: 0

      - name: Upload Unity build diagnostics
        if: steps.detect_xcode.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-Unity-Build-Diagnostics-v1
          path: unity-build-diagnostics
          if-no-files-found: ignore
          compression-level: 0

      - name: Clean failed recovered project permissions
        if: steps.detect_xcode.outputs.ready != 'true'
        run: |
          set +e

          PROJECT="${{ steps.locate.outputs.project }}"

          # Temp/Library are disposable Unity caches and caused the EACCES
          # seen in v10 while upload-artifact tried to stat fsbankcache files.
          sudo rm -rf \
            "$PROJECT/Temp" \
            "$PROJECT/Library" \
            "$PROJECT/obj" \
            2>/dev/null || true

          sudo chown -R "$(id -u):$(id -g)" recovered-artifact || true
          chmod -R u+rwX recovered-artifact || true

      - name: Upload Unity failure project
        if: steps.detect_xcode.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-Unity-iOS-FAIL-v1
          path: recovered-artifact
          if-no-files-found: ignore
          compression-level: 0

  package_unsigned_ipa:
    name: Package unsigned IPA from Xcode output
    needs: build_unity_ios
    if: needs.build_unity_ios.outputs.xcode_ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout for original APK icon
        uses: actions/checkout@v4

      - name: Download Unity Xcode project
        uses: actions/download-artifact@v4
        with:
          name: Sonic-2006-iOS-Xcode
          path: unity-ios

      - name: Patch old Unity 2018 headers for current Xcode
        run: |
          set -e

          find unity-ios -type f \
            \( -name "UnityInterface.h" -o -name "UnityRendering.h" \) \
            -print \
            | while read -r FILE; do
                if ! grep -q "<stdbool.h>" "$FILE"; then
                  printf '#include <stdbool.h>\n' | cat - "$FILE" > "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                fi
              done

      - name: Restore Unity script permissions and replace app icon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "===== RESTORE UNITY SHELL SCRIPT EXECUTE BITS ====="
          find unity-ios -type f -name "*.sh" -print -exec chmod +x {} \;

          echo "===== FIND ORIGINAL ANDROID APP ICON ====="
          rm -rf icon-work
          mkdir -p icon-work/android

          APK=""

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if unzip -l "$FILE" >/dev/null 2>&1; then
              APK="$FILE"
              break
            fi
          done < <(
            find . -type f -iname "*.apk" -not -path "./unity-ios/*" | sort
          )

          if [ -z "$APK" ]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$TAG" ]; then
              gh release download "$TAG" \
                --pattern "*.apk" \
                --dir icon-work \
                || true
              APK=$(find icon-work -type f -iname "*.apk" | head -1 || true)
            fi
          fi

          if [ -n "$APK" ]; then
            unzip -q "$APK" -d icon-work/android

            ICON=$(
              find icon-work/android/res -type f \
                \( -iname "*ic_launcher*.png" -o -iname "*app_icon*.png" \
                   -o -iname "*icon*.png" \) \
                -print0 2>/dev/null \
                | xargs -0 ls -S 2>/dev/null \
                | head -1
            )

            if [ -n "$ICON" ] && [ -f "$ICON" ]; then
              echo "ICON_SOURCE=$ICON"

              APPICON_DIR=$(find unity-ios -type d -name "AppIcon.appiconset" | head -1 || true)

              if [ -n "$APPICON_DIR" ]; then
                echo "APPICON_DIR=$APPICON_DIR"

                # Replace every existing icon PNG at its original dimensions.
                find "$APPICON_DIR" -type f -iname "*.png" -print \
                  | while read -r OUT; do
                      W=$(sips -g pixelWidth "$OUT" 2>/dev/null | awk '/pixelWidth/ {print $2}')
                      H=$(sips -g pixelHeight "$OUT" 2>/dev/null | awk '/pixelHeight/ {print $2}')

                      if [ -n "$W" ] && [ -n "$H" ]; then
                        sips -z "$H" "$W" "$ICON" --out "$OUT" >/dev/null
                        echo "Replaced icon: $OUT (${W}x${H})"
                      fi
                    done
              else
                echo "WARNING: AppIcon.appiconset not found; keeping Unity icon."
              fi
            else
              echo "WARNING: Android app icon was not found."
            fi
          else
            echo "WARNING: APK not found in repo/release; keeping Unity icon."
          fi

      - name: Build unsigned arm64 app
        run: |
          set -e
          set -o pipefail

          PROJ=$(find unity-ios -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJ" ]; then
            echo "ERROR: Unity Xcode project not found."
            find unity-ios -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJ"

          echo "===== XCODE PROJECT SCHEMES ====="
          xcodebuild -project "$PROJ" -list || true

          # Modern Xcode does not allow -derivedDataPath together with -target.
          # Unity's generated app scheme is normally Unity-iPhone, so use
          # -scheme instead. This is the exact fix for v17 exit code 64.
          SCHEME="Unity-iPhone"

          if ! xcodebuild -project "$PROJ" -list 2>/dev/null \
                | grep -A50 "Schemes:" \
                | grep -qE '^[[:space:]]*Unity-iPhone[[:space:]]*$'; then
            DETECTED_SCHEME=$(
              xcodebuild -project "$PROJ" -list 2>/dev/null \
                | awk '
                    /Schemes:/ {in_schemes=1; next}
                    in_schemes && NF {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); print; exit}
                  '
            )
            if [ -n "$DETECTED_SCHEME" ]; then
              SCHEME="$DETECTED_SCHEME"
            fi
          fi

          echo "XCODE_SCHEME=$SCHEME"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            PRODUCT_BUNDLE_IDENTIFIER="com.sonic2006.ios.port" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee xcodebuild.log

      - name: Locate app and create KSign IPA
        run: |
          set -e

          APP=$(find DerivedData -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: built .app not found."
            exit 1
          fi

          rm -rf Payload output
          mkdir -p Payload output

          cp -R "$APP" Payload/

          # KSign will perform the real signing on the iPhone.
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            output/Sonic-P06-Sonic-Release-iOS-KSign-v1.ipa

          ls -lh output/Sonic-P06-Sonic-Release-iOS-KSign-v1.ipa

      - name: Upload Sonic iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-iOS-KSign-v1
          path: |
            output/Sonic-P06-Sonic-Release-iOS-KSign-v1.ipa
            xcodebuild.log
          compression-level: 0

      - name: Upload Xcode failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-2006-Xcode-FAIL
          path: xcodebuild.log
          if-no-files-found: ignore

  capture_full_unity_log:
    name: Capture full Unity crash log
    needs: build_unity_ios
    if: always() && needs.build_unity_ios.outputs.xcode_ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    steps:
      - name: Download completed Unity job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p full-unity-log

          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "REPOSITORY=$GITHUB_REPOSITORY"

          JOB_ID=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Setup + Activate + Build Unity iOS") | .id' \
              | head -1
          )

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: Could not locate the completed Unity build job."
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | [.id,.name,.status,.conclusion] | @tsv' \
              | tee full-unity-log/jobs.txt
            exit 1
          fi

          echo "UNITY_JOB_ID=$JOB_ID" | tee full-unity-log/job-id.txt

          # Download as raw bytes. `gh api` can reject this log because it
          # contains terminal escape sequences; curl does not.
          HTTP_CODE=$(
            curl \
              --location \
              --silent \
              --show-error \
              --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o full-unity-log/Unity-build-job.log \
              -w "%{http_code}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs"
          )

          echo "HTTP_CODE=$HTTP_CODE" | tee full-unity-log/http.txt
          test -s full-unity-log/Unity-build-job.log

          echo "===== LOG SIZE ====="
          wc -c full-unity-log/Unity-build-job.log
          wc -l full-unity-log/Unity-build-job.log || true

          echo "===== IMPORTANT LINES ====="
          grep -a -niE \
            'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Aborting batchmode|SIGABRT|Caught fatal signal|Assertion failed|AudioManager|FMOD|Exception|Fatal error|Build failed|exit code 134|did the Editor crash|executeMethod class|langversion' \
            full-unity-log/Unity-build-job.log \
            | tail -500 \
            | tee full-unity-log/important-errors.txt \
            || true

          echo "===== LAST 500 LINES ====="
          tail -500 full-unity-log/Unity-build-job.log \
            > full-unity-log/tail-500.txt \
            || true

      - name: Upload full Unity crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-P06-Sonic-Release-FULL-Unity-Log-v1
          path: full-unity-log
          if-no-files-found: warn
          compression-level: 0

